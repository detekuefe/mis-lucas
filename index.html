<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis lucas</title>
<meta name="theme-color" content="#16845b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis lucas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
:root{
  --bg:#F7F3EC;--surface:#FFFFFF;--ink:#1F2A24;--muted:#6B7570;--line:#ECE6DC;
  --green:#2F8F6B;--green-ink:#1F6B4F;--mint:#E3F1E9;
  --amber:#9A6408;--amber-bg:#FCF1DC;--red:#B8503C;--red-bg:#FBE7E1;
  --mark-ok:#2F8F6B;--mark-over:#E0A21E;--plan-ink:#1F2A24;--grid:#EFEAE1;
  --shadow:0 1px 2px rgb(70 50 20/.05),0 6px 20px rgb(70 50 20/.06);
  --hero:linear-gradient(140deg,#2F8F6B 0%,#3E9F78 100%);--hero-over:linear-gradient(140deg,#C0614A 0%,#CF7A55 100%);
  --display:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111915;--surface:#1A241F;--ink:#E8EFEA;--muted:#9AA8A0;--line:#27342D;
  --green:#3FA57E;--green-ink:#9BE0C0;--mint:#1E3A2E;
  --amber:#E5B45A;--amber-bg:#3A2E16;--red:#E68A75;--red-bg:#3D2420;
  --mark-ok:#3FA57E;--mark-over:#E5B45A;--plan-ink:#E8EFEA;--grid:#24302A;
  --shadow:0 1px 2px rgb(0 0 0/.25),0 6px 20px rgb(0 0 0/.18);
  --hero:linear-gradient(140deg,#24785A 0%,#2E8A66 100%);--hero-over:linear-gradient(140deg,#A3503D 0%,#B4644A 100%);
}}
/* Íconos: mosaico con color por categoría */
.pi{font-size:1em;line-height:1}
.c0{--c:#2E7D4F}.c1{--c:#C2571A}.c2{--c:#2A6CB8}.c3{--c:#C03A60}.c4{--c:#5B47B8}.c5{--c:#A83C87}.c6{--c:#9A6A00}.c7{--c:#1E8077}.c8{--c:#6B675F}
@media (prefers-color-scheme:dark){.c0{--c:#6FCB95}.c1{--c:#F09A62}.c2{--c:#7FB2EE}.c3{--c:#EE8AA6}.c4{--c:#A99BF0}.c5{--c:#E08BC6}.c6{--c:#E5BE5C}.c7{--c:#6CCFC4}.c8{--c:#B3AEA5}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 14px}
.brand{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.02em}
.date{color:var(--muted);font-size:14px}
.hidden{display:none!important}
.navbrand{display:none;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink);padding:0 8px 18px;margin-top:-56px}
.navbrand img{border-radius:9px}
.days{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.days span{width:10px;height:10px;border-radius:50%;background:rgb(255 255 255/.22)}
.days .ok{background:#fff}
.days .over{background:transparent;box-shadow:inset 0 0 0 2px #FFD27A}
.days .today{background:transparent;box-shadow:inset 0 0 0 2px #fff}
.days .today.bad{box-shadow:inset 0 0 0 2px #FFD27A}
.days .off{background:rgb(255 255 255/.1)}
.goalbar{height:10px;border-radius:99px;background:var(--mint);overflow:hidden;margin:10px 0 8px;position:relative}
.goalbar i{display:block;height:100%;border-radius:99px;background:var(--green);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.goalbar.short i{background:#D9A02B}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini3 div{background:var(--bg);border-radius:10px;padding:8px 10px}
.mini3 span{display:block;font-size:12px;color:var(--muted)}
.mini3 b{font-variant-numeric:tabular-nums;font-size:14.5px}
.coin{position:absolute;left:var(--x);top:-36px;width:26px;height:26px;border-radius:50%;background:#F2C14E;box-shadow:inset 0 0 0 2.5px #C99418,inset 0 0 0 5px #F6D27A;color:#8A6106;font:700 13px/26px var(--display);text-align:center;z-index:2;pointer-events:none;
  animation:coinfall .75s cubic-bezier(.55,0,1,.45) var(--d) forwards,coinout .35s ease calc(var(--d) + 1.05s) forwards;opacity:0}
@keyframes coinfall{0%{opacity:1;transform:translateY(0) rotate(0)}80%{opacity:1;transform:translateY(var(--y)) rotate(var(--r))}90%{transform:translateY(calc(var(--y) - 10px)) rotate(var(--r))}100%{opacity:1;transform:translateY(var(--y)) rotate(var(--r))}}
@keyframes coinout{to{opacity:0;transform:translateY(var(--y)) scale(.6)}}
.amount.hide{opacity:0}
.amount.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.85);opacity:.3}100%{transform:scale(1);opacity:1}}
.days.anim span{animation:dotin .35s ease backwards}
@keyframes dotin{from{transform:scale(0)}}
.view.fade{animation:fadein .28s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.toast.show{animation:toastin .25s ease}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:1px}
.sync[hidden]{display:none}
.sync.ok{background:var(--green)}
nav.tabs button{position:relative}
nav.tabs button.alert::after{content:'';position:absolute;top:6px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:#D9A02B;box-shadow:0 0 0 2px var(--surface)}.sync.wait{background:#D9A02B}.sync.err{background:var(--red)}


/* El héroe: lo único llamativo de la app */
.hero{background:var(--hero);color:#fff;border-radius:28px;padding:20px 22px 20px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgb(47 143 107/.22)}
.hero::before{content:'';position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgb(255 255 255/.08);pointer-events:none}
.hero.over{background:var(--hero-over);box-shadow:0 10px 30px rgb(192 97 74/.22)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgb(255 255 255/.18);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.hero .btn{display:inline-flex;align-items:center;gap:8px}
.hero .btn .pi{font-size:19px}
.amount{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,52px);line-height:1.05;letter-spacing:-.025em;margin:8px 0 14px;font-variant-numeric:tabular-nums;min-height:1.05em}
.drain{height:7px;border-radius:99px;background:rgb(255 255 255/.22);overflow:hidden}
.drain i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .6s ease}
.hero-sub{font-size:14px;margin-top:10px;opacity:.92}
.hero-msg{margin:12px 0 0;font-size:15px;background:rgb(0 0 0/.13);padding:10px 12px;border-radius:12px}
.hero .btn{margin-top:10px;background:#fff;color:#0E5E40}

.capture{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 10px}
.cap{flex-direction:row!important;justify-content:center;padding:12px 8px!important;gap:10px!important}
.cap .pi{width:38px!important;height:38px!important;line-height:38px!important;font-size:21px!important}
.bigmic{display:flex;align-items:center;gap:14px;width:100%;margin:14px 0 10px;padding:14px 16px;border:0;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:transform .12s ease}
.bigmic:active{transform:scale(.98)}
.bigmic>.pi{width:56px;height:56px;line-height:56px;text-align:center;border-radius:50%;background:var(--green);color:#fff;font-size:28px;flex:none;box-shadow:0 0 0 6px var(--mint)}
.bigmic b{display:block;font-family:var(--display);font-size:18px;font-weight:800}
.bigmic span span{display:block;font-size:13.5px;color:var(--muted)}
.lnh{display:flex;align-items:center;gap:10px;padding-top:8px}
.lnh .ic{width:32px;height:32px;font-size:18px;border-radius:10px}
.cap{background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:20px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;cursor:pointer}
.cap .pi{font-size:24px;width:44px;height:44px;line-height:44px;text-align:center;border-radius:14px;display:inline-block;color:var(--green);background:var(--mint)}
.cap{transition:transform .12s ease,border-color .2s}
.cap:active,.btn:active{transform:scale(.96)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.quick .btn{padding:9px 4px;font-size:13.5px}

.btn{display:inline-block;border:0;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--green);color:#fff;text-decoration:none;text-align:center}
.btn.soft{background:var(--mint);color:var(--green-ink)}
.btn.line{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.block{display:block;width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btn.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.gbtn.block{display:flex}
.btn.gbtn svg{width:18px;height:18px;flex:none}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0;font-size:14px}

.card{background:var(--surface);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-family:var(--display);font-size:19px;font-weight:800;margin:0 0 10px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kv{padding:5px 0}
.num{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.pos{color:var(--green)}
.note{border-radius:14px;padding:11px 13px;font-size:14.5px;margin-top:10px}
.note.good{background:var(--mint);color:var(--green-ink)}
.note.warn{background:var(--amber-bg);color:var(--amber)}
.note.bad{background:var(--red-bg);color:var(--red)}

.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.it:first-child{border-top:0}
.ic{width:40px;height:40px;border-radius:13px;color:var(--c,var(--green));background:color-mix(in srgb,var(--c,var(--green)) 13%,var(--surface));display:grid;place-items:center;font-size:21px;flex:none}
.it .tx{flex:1;min-width:0}
.it .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tx span{display:block}
.dayhead{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin:16px 2px 4px;font-weight:600}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);box-shadow:0 -4px 20px rgb(70 50 20/.07);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav.tabs button{background:none;border:0;padding:6px 8px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;min-width:68px}
nav.tabs button .pi{font-size:23px}
nav.tabs button.on{color:var(--green-ink);background:var(--mint);font-weight:700}
/* Gráfico de gasto diario */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--mark-ok)}
.legend i.over{background:var(--mark-over)}
.legend i.plan{width:14px;height:2px;border-radius:2px;background:var(--plan-ink);opacity:.55}
.dchart{position:relative;height:170px;margin:8px 0 6px 52px;outline:none}
.dc-gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.dc-gl.base{border-top-color:var(--line)}
.dc-gl span{position:absolute;right:calc(100% + 8px);top:-8px;font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.dc-cols{position:absolute;inset:0;display:flex}
.dc-col{flex:1;position:relative;border-radius:6px;cursor:default}
.dc-col.hov{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.dc-bar{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(70%,24px);border-radius:4px 4px 0 0;background:var(--mark-ok)}
.dc-bar.over{background:var(--mark-over)}
.dc-plan{position:absolute;left:50%;transform:translate(-50%,1px);width:min(100%,30px);height:2px;border-radius:2px;background:var(--plan-ink);opacity:.55}
.dc-col.fut .dc-plan{opacity:.2}
.dc-x{display:flex;justify-content:space-between;margin-left:52px;font-size:11px;color:var(--muted);position:relative}
.dc-today{position:absolute;transform:translateX(-50%);font-weight:700;color:var(--ink)}
.dc-tip{position:absolute;bottom:calc(100% + 6px);transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:12px;padding:8px 11px;font-size:12.5px;line-height:1.4;white-space:nowrap;pointer-events:none;z-index:3;box-shadow:0 6px 18px rgb(0 0 0/.18)}
.dc-tip b{display:block;font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);padding-bottom:2px}
.cd{min-height:52px;border:0;border-radius:12px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--bg);cursor:pointer;min-width:0}
.cd.out{visibility:hidden}
.cd .n{font-weight:700;font-size:13px;line-height:1.2}
.cd .a{font-size:10px;line-height:1.2;color:var(--ink);opacity:.75;white-space:nowrap;font-variant-numeric:tabular-nums}
.cd.fut .n{color:var(--muted)}
.cd.ok{background:color-mix(in srgb,var(--mark-ok) 16%,var(--surface))}
.cd.over{background:color-mix(in srgb,var(--mark-over) 26%,var(--surface))}
.cd.today{box-shadow:inset 0 0 0 2px var(--green)}
.cd.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cd .dots{display:flex;gap:2px;margin-top:auto;min-height:6px}
.cd .dots i,.legend i.dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
.legend i.dot{width:8px;height:8px}
.dots i.due,.legend i.dot.due{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mark-over)}
.navb{padding:6px 9px;line-height:1}
.calday{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.adv{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.adv:first-of-type{border-top:0;padding-top:2px}
.adv>div:last-child{flex:1;min-width:0}
.adv ul{margin:6px 0;padding-left:18px}
.adv li{margin:2px 0}
.split{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;margin:10px 0 8px}
.split i{display:block;background:var(--c)}
.note .pi{font-size:20px;flex:none;margin-top:1px}
.catrow{display:flex;gap:12px;align-items:center;padding:7px 0}
.catrow .cr{flex:1;min-width:0}
.catrow .bar{margin:6px 0 0}
.catrow small{color:var(--muted);font-weight:600;margin-left:6px}

.sheet-bg{position:fixed;inset:0;background:rgb(8 22 15/.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.anim{animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0 0 12px}
label.f{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin:10px 0 4px}
.i{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:13px;padding:11px 12px;outline:none;min-width:0}
.i:focus{border-color:var(--green)}
textarea.i{resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:13px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:9px;border-radius:10px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.1)}
.ln{border:1px solid var(--line);border-radius:14px;padding:4px 12px 10px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ln .full{grid-column:1/-1}
.mic{width:100px;height:100px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:40px;display:block;margin:8px auto;cursor:pointer}
.mic.rec{background:#B4392F;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 16px rgb(180 57 47/.18)}}
.preview img{max-width:100%;max-height:280px;border-radius:12px;display:block;margin:10px auto}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-bottom:4px;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;white-space:nowrap;cursor:pointer;font-size:14px}
.chips button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--bg);border-radius:12px;padding:10px}
.stats b{display:block;font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;margin-top:2px}
.bill{border-top:1px solid var(--line);padding:12px 0}
.bill:first-of-type{border-top:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--muted);margin-top:3px}
.tag.late{background:var(--red-bg);color:var(--red)}
.tag.soon{background:var(--amber-bg);color:var(--amber)}
.tag.ok{background:var(--mint);color:var(--green-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:14px;display:none;gap:14px;align-items:center;z-index:60;width:max-content;max-width:calc(100% - 32px);font-size:14.5px;box-shadow:0 8px 24px rgb(0 0 0/.25)}
.toast.show{display:flex}
.toast button{background:none;border:0;color:#7FE0B2;font-weight:700;cursor:pointer;padding:0}
@media (prefers-color-scheme:dark){.toast button{color:var(--green)}}
.empty{text-align:center;padding:18px 8px;color:var(--muted)}

@media (min-width:900px){
  .app{max-width:1140px;padding:26px 34px 40px 258px}
  nav.tabs{top:0;bottom:0;right:auto;width:224px;flex-direction:column;justify-content:flex-start;box-shadow:4px 0 20px rgb(70 50 20/.05);padding:78px 14px 14px;gap:4px}
  nav.tabs button{flex-direction:row;font-size:15px;justify-content:flex-start;padding:10px 12px;gap:10px;min-width:0}
  nav.tabs button .pi{font-size:21px}
  .top .brand{visibility:hidden}
  .navbrand{display:flex!important}
  .home{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:start}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  .sheet-bg{align-items:center}
  .sheet{border-radius:24px;max-height:86vh}
  .toast{bottom:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand">Mis lucas</div><div class="date"><span id="syncDot" class="sync" hidden></span><span id="date"></span></div></header>
  <main>
    <section id="v-hoy" class="view"></section>
    <section id="v-mov" class="view hidden"></section>
    <section id="v-cue" class="view hidden"></section>

  </main>
</div>

</nav>
<div id="sheetBg" class="sheet-bg" onclick="if(event.target===this&&!LOCK)closeSheet()"><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status"><span id="toastMsg"></span><button id="toastBtn"></button></div>

<script>
/* ===================== Utilidades ===================== */
const KEY='mi_dinero_v2', IMG='mi_dinero_v2_img_', VERSION='3.3';
const CATS=[['Supermercado','shopping-cart'],['Comida fuera','fork-knife'],['Transporte','bus'],['Salud','pill'],['Hogar','house'],['Ocio','popcorn'],['Compras','shopping-bag'],['Cuentas','invoice'],['Otros','package']];
const ico=n=>`<i class="pi ph-duotone ph-${n}" aria-hidden="true"></i>`;
const catIcon=c=>ico((CATS.find(x=>x[0]===c)||[0,'package'])[1]);
// Color del mosaico: cada categoría conserva siempre el suyo
const catCls=c=>{const i=CATS.findIndex(x=>x[0]===c);return 'c'+(i<0?8:i)};
const tile=(c,inner)=>`<div class="ic ${catCls(c)}">${inner||catIcon(c)}</div>`;
const FMT=new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0});
const money=n=>FMT.format(Math.round(n||0)).replace('-$','−$');
const plain=n=>n?Math.round(n).toLocaleString('es-CL'):'';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const todayStr=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const dayDiff=(a,b)=>Math.round((parseYmd(a)-parseYmd(b))/864e5);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const nice=s=>{const d=parseYmd(s);return d.getDate()+' '+MES[d.getMonth()]};
const cap1=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const toNum=v=>{const n=Number(String(v??'').replace(/[^\d]/g,''));return isFinite(n)?n:0};
const sum=(a,f)=>a.reduce((x,m)=>x+f(m),0);

/* ===================== Datos ===================== */
// Efecto de cada movimiento sobre el saldo. El saldo siempre se calcula: saldo inicial + movimientos.
// Así dos dispositivos sincronizados nunca se pisan el saldo entre sí.
const eff=m=>m.type==='expense'?-m.amount:m.type==='income'?m.amount:(m.type==='adjust'||m.type==='loan')?m.amount:0;
function blank(){return{v:2,setup:false,created:todayStr(),opening:0,balance:0,checked:null,goal:{name:'Ahorro del mes',amount:0},payday:1,movements:[],bills:[],loans:[],dayLog:{}}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===2){
  const r=Object.assign(blank(),s);
  if(s.opening===undefined)r.opening=(s.balance||0)-sum(r.movements,eff);
  if(r.paid){for(const k in r.paid)for(const b in r.paid[k]){const m=r.movements.find(x=>x.id===r.paid[k][b]);if(m)m.billPeriod=k}delete r.paid}
  return r}}catch(e){}return blank()}
let S=load();
function recalc(){S.balance=(S.opening||0)+sum(S.movements,eff)}
recalc();
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar: el almacenamiento está lleno. Exporta un respaldo y borra fotos de boletas antiguas.')}}
function save(){saveLocal();if(window.MD_SYNC)window.MD_SYNC.push()}
function addMov(m){m.id=m.id||uid();m.at=Date.now();S.movements.push(m);recalc();return m}
function delMov(id){
  const i=S.movements.findIndex(x=>x.id===id);if(i<0)return;
  const m=S.movements[i];S.movements.splice(i,1);recalc();
  if(m.img)try{localStorage.removeItem(IMG+id)}catch(e){}
}

/* ===================== Período y cálculo diario ===================== */
function period(t=todayStr()){
  const now=parseYmd(t),pd=S.payday||1;
  const mk=(y,m)=>{const d=new Date(y,m,1);return new Date(d.getFullYear(),d.getMonth(),Math.min(pd,dim(d.getFullYear(),d.getMonth())))};
  let start=mk(now.getFullYear(),now.getMonth());
  if(start>now)start=mk(now.getFullYear(),now.getMonth()-1);
  const next=mk(start.getFullYear(),start.getMonth()+1);
  const end=new Date(next);end.setDate(end.getDate()-1);
  const s=ymd(start),e=ymd(end);
  return{start:s,end:e,key:s,left:dayDiff(e,t)+1,day:dayDiff(t,s)+1};
}
function billDue(b,P){
  const s=parseYmd(P.start);
  const at=(y,m)=>{const d=new Date(y,m,1);return new Date(d.getFullYear(),d.getMonth(),Math.min(b.day,dim(d.getFullYear(),d.getMonth())))};
  let d=at(s.getFullYear(),s.getMonth());
  if(ymd(d)<P.start)d=at(s.getFullYear(),s.getMonth()+1);
  return ymd(d);
}
// Préstamos: dir 'in' = me prestaron (deuda), 'out' = presté (me deben)
const loanPaid=l=>sum(S.movements.filter(m=>m.loanId===l.id&&m.kind==='pago'),m=>Math.abs(m.amount));
const loanLeft=l=>Math.max(0,l.amount-loanPaid(l));
const debtTotal=()=>sum(S.loans.filter(l=>l.dir==='in'),loanLeft);
const owedTotal=()=>sum(S.loans.filter(l=>l.dir==='out'),loanLeft);
function billPaid(b,P){return S.movements.find(m=>m.billId===b.id&&m.billPeriod===P.key)||null}

function calc(){
  recalc();
  const P=period(),t=todayStr();
  const inP=m=>m.date>=P.start&&m.date<=P.end;
  let pending=0,paidTodayEst=0,paidTotal=0,estTotal=0;
  S.bills.forEach(b=>{estTotal+=b.amount;const m=billPaid(b,P);if(!m)pending+=b.amount;else{paidTotal+=m.amount;if(m.date===t)paidTodayEst+=b.amount}});
  const todays=S.movements.filter(m=>m.date===t);
  const todayExp=sum(todays.filter(m=>m.type==='expense'),m=>m.amount);
  const todayDisc=sum(todays.filter(m=>m.type==='expense'&&!m.billId),m=>m.amount);
  const savesToday=sum(todays.filter(m=>m.type==='save'),m=>m.amount);
  const savesBefore=sum(S.movements.filter(m=>m.type==='save'&&inP(m)&&m.date<t),m=>m.amount);
  const goalStart=S.goal.amount+savesBefore, goalNow=goalStart+savesToday;
  // Plan del día: se calcula con el saldo al empezar el día, para que lo gastado hoy no se descuente dos veces
  // Lo que debes no es dinero disponible: se reserva completo hasta que lo pagues
  const debt=debtTotal(),owed=owedTotal();
  const flexStart=(S.balance+todayExp)-(pending+paidTodayEst)-debt-goalStart;
  const plan=Math.max(0,flexStart)/P.left;
  const used=todayDisc+savesToday, left=plan-used;
  const flexNow=S.balance-pending-debt-goalNow;
  const tomorrow=P.left>1?Math.max(0,flexNow)/(P.left-1):0;
  return{P,t,debt,owed,pending,paidTotal,estTotal,todayDisc,savesToday,goalNow,saves:savesBefore+savesToday,plan,used,left,flexStart,flexNow,tomorrow};
}
const discOn=d=>sum(S.movements.filter(m=>m.date===d&&m.type==='expense'&&!m.billId),m=>m.amount);
const usedOn=d=>discOn(d)+sum(S.movements.filter(m=>m.date===d&&m.type==='save'),m=>m.amount);
function logDay(c){
  const L=S.dayLog[c.t],p=Math.round(c.plan);
  if(!L||Math.abs(L.plan-p)>1){
    S.dayLog[c.t]={plan:p};
    const lim=addDays(c.t,-150);for(const k in S.dayLog)if(k<lim)delete S.dayLog[k];
    save();
  }
}
function streak(){
  let n=0,d=addDays(todayStr(),-1);
  for(let i=0;i<120&&d>=S.created;i++){
    const L=S.dayLog[d],sp=discOn(d);
    if(!(L?sp<=L.plan+1:sp===0))break;
    n++;d=addDays(d,-1);
  }
  return n;
}
function yesterdayLeft(){const y=addDays(todayStr(),-1),L=S.dayLog[y];return L?L.plan-usedOn(y):0}
function periodMargin(c){let s=0;for(let d=c.P.start;d<c.t;d=addDays(d,1)){const L=S.dayLog[d];if(L)s+=L.plan-usedOn(d)}return s}

/* ===================== Interpretar texto y voz ===================== */
const NORM=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const KW={
 'Cuentas':['luz(\\s|$)','agua(\\s|$)','gas(\\s|$)','internet','telefono','plan celular','arriendo','dividendo','gastos comunes','cuota','seguro','enel','chilquinta','esval','cge(\\s|$)','vtr','entel','movistar','wom(\\s|$)','claro(\\s|$)','tarjeta'],
 'Supermercado':['super','lider','jumbo','unimarc','tottus','santa isabel','acuenta','feria','verdura','fruta','pan(\\s|$)','panaderia','almacen','minimarket','mercaderia','carniceria','leche','huevo','abarrote'],
 'Comida fuera':['almuerzo','comida','restaurant','restoran','cafe(\\s|$)','cafeteria','completo','sushi','pizza','hamburguesa','delivery','rappi','pedidos ya','pedidosya','uber eats','bar(\\s|$)','cerveza','helado','colacion','once(\\s|$)','empanada'],
 'Transporte':['bencina','combustible','copec','shell','aramco','petrobras','uber','didi','cabify','micro(\\s|$)','metro(\\s|$)','bip','peaje','tag(\\s|$)','estacionamiento','taxi','colectivo','bus(\\s|$)','pasaje','tren','merval','mecanico','neumatico'],
 'Salud':['farmacia','remedio','medicamento','cruz verde','salcobrand','ahumada','doctor','medico','consulta','dentista','examen','kine','clinica','bono(\\s|$)','isapre','fonasa','lentes','odontol','dental','optica','laboratorio','centro medico','integramedica','redsalud','vidaintegra','psicolog','veterinari'],
 'Hogar':['ferreteria','sodimac','easy(\\s|$)','aseo','limpieza','mueble','arreglo','gasfiter','lavanderia','jardin','construmart','detergente'],
 'Ocio':['cine','juego','salida','entrada','concierto','viaje','paseo','carrete','libro','netflix','spotify','disney','hbo','gimnasio','gym'],
 'Compras':['ropa','zapatilla','zapato','polera','pantalon','chaqueta','falabella','paris(\\s|$)','ripley','mercado libre','regalo','amazon','aliexpress','shein','temu','tienda']
};
const KWRE=Object.entries(KW).map(([c,l])=>[c,new RegExp('(^|\\s)('+l.join('|')+')')]);
function guessCat(t){const n=' '+NORM(t)+' ';for(const[c,re]of KWRE)if(re.test(n))return c;return 'Otros'}
const NUMW={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50,cien:100,media:0.5};
const AMT=/\$?\s*(\d{1,3}(?:\.\d{3})+|\d+(?:[.,]\d{1,2})?)\s*(lucas?|mil|k|palos?|mill[oó]n(?:es)?)?(?=[\s.,;!?]|$)/i;
const STOP=/(^|\s)(gast[eé]|gastamos|pagu[eé]|compr[eé]|me|sali[oó]|cost[oó]|costaron|fueron|son|hoy|ayer|anteayer|antes|en|el|la|los|las|de|del|por|un|una|unos|unas|para|al|con|que|pesos|clp|lucas?|mil|recib[ií]|pagaron|depositaron|transfirieron)(?=\s|$)/gi;
const INCOME=/(me pagaron|me pag[oó]|me depositaron|me deposit[oó]|me transfirieron|me transfiri[oó]|me devolvieron|me devolvi[oó]|me lleg[oó]|me llegaron|recib[ií]|ingreso|sueldo|gan[eé]|bono de|vend[ií]|cobr[eé])/i;
const SAVE=/(apart[eé]|guard[eé]|ahorr[eé]|separ[eé])/i;
const NAME='([a-zñáéíóú]+)',ART='(?:la\\s+|el\\s+|mi\\s+)?';
// Nombre de persona: la palabra después de "a"/"al" (presté a Juan) o la que acompaña a "me prestó"
const pName=(p,re)=>{const m=p.match(re);return m?cap1(m[m.length-1].toLowerCase()):''};
const findLoan=(name,dir)=>{const n=NORM(name);return n?S.loans.find(l=>loanLeft(l)>0&&(!dir||l.dir===dir)&&(NORM(l.person).split(/\s+/)[0]===n||NORM(l.person)===n)):null};
const findBill=p=>{const n=' '+NORM(p).replace(/[^a-z0-9ñ ]/g,' ')+' ';return S.bills.find(b=>{const b1=NORM(b.name).trim();return b1&&n.includes(' '+b1+' ')})};
// Decide qué es cada frase: ahorro, préstamo, abono, pago de cuenta, ingreso o gasto
function classify(p,whole,single,row){
  const P=' '+p+' ';
  if(SAVE.test(P)&&/(meta|ahorro|apart|guard|separ)/i.test(P))return Object.assign(row,{type:'save',cat:'Meta',desc:'Apartado para la meta'});
  // Presté a Juan
  if(/prest[eé]/i.test(P)){const who=pName(P,new RegExp('prest[eé]\\s.*?\\ba(?:l)?\\s+'+ART+NAME,'i'));return Object.assign(row,{type:'loan',dir:'out',person:who,due:addDays(row.date,30),desc:''})}
  // Juan me prestó / me prestó Juan
  if(/me\s+prest(?:[oó]|aron)/i.test(P)){const who=pName(P,new RegExp(NAME+'\\s+me\\s+prest','i'))||pName(P,new RegExp('me\\s+prest[oó]\\s+'+ART+NAME,'i'))||pName(P,new RegExp('(?:lucas?|mil|\\d)\\s+'+ART+NAME+'\\s*$','i'));return Object.assign(row,{type:'loan',dir:'in',person:who,due:addDays(row.date,30),desc:''})}
  // Le pagué / le devolví a Juan (abono a una deuda)
  if(/(pagu[eé]|devolv[ií]|abon[eé])/i.test(P)){const who=pName(P,new RegExp('\\ba(?:l)?\\s+'+ART+NAME,'i')),l=findLoan(who,'in');if(l)return Object.assign(row,{type:'loanpay',loanId:l.id,desc:''})}
  // Juan me pagó / me devolvió Juan (cobro de algo que presté)
  if(/me\s+(pag[oó]|devolvi[oó]|abon[oó])/i.test(P)){const who=pName(P,new RegExp(NAME+'\\s+me\\s+(?:pag|devolv|abon)','i'))||pName(P,new RegExp('me\\s+(?:pag[oó]|devolvi[oó]|abon[oó])\\s+'+NAME,'i')),l=findLoan(who,'out');if(l)return Object.assign(row,{type:'loanpay',loanId:l.id,desc:''})}
  // Pagué la luz
  const b=findBill(P);if(b&&!INCOME.test(P))return Object.assign(row,{type:'bill',billId:b.id,cat:'Cuentas',desc:b.name});
  if(INCOME.test(P)||(INCOME.test(whole)&&single))return Object.assign(row,{type:'income',cat:'Ingreso'});
  return row;
}

function parse(text){
  if(!text||!text.trim())return[];
  let t=' '+text.trim()+' ';
  let date=todayStr();
  if(/anteayer|antes de ayer/i.test(t))date=addDays(date,-2);else if(/\bayer\b/i.test(t))date=addDays(date,-1);
  t=t.replace(/(^|\s)(un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|quince|veinte|treinta|cuarenta|cincuenta|cien)\s+(lucas?|mil)(?=\s|$)/gi,(m,a,w,u)=>a+NUMW[w.toLowerCase()]+' '+u);
  t=t.replace(/(^|\s)lucas?(?=\s|$)/gi,(m,a,o,s)=>{const before=s.slice(0,o).trim();return /\d$/.test(before)?m:a+'1 luca'});
  t=t.replace(/(\d+(?:[.,]\d+)?)\s*(lucas?|mil)\s+y\s+media/gi,(m,n,u)=>(parseFloat(n.replace(',','.'))+0.5)+' '+u);
  const pieces=t.replace(/\s+(y|m[aá]s|adem[aá]s|tambi[eé]n|luego)\s+/gi,' | ').split(/,\s+|;|\|/).map(s=>s.trim()).filter(Boolean);
  const items=[];let carry='',carryRaw='';
  for(const p of pieces){
    const m=p.match(AMT);
    if(!m){
      const d=p.replace(STOP,' ').replace(/\s+/g,' ').trim();
      if(!d)continue;
      if(items.length){const last=items[items.length-1];last.desc=last.desc?last.desc+', '+d:cap1(d);if(last.cat==='Otros')last.cat=guessCat(last.desc)}
      else{carry=carry?carry+', '+d:d;carryRaw+=' '+p}
      continue;
    }
    let raw=m[1],n;
    if(/^\d{1,3}(\.\d{3})+$/.test(raw))n=Number(raw.replace(/\./g,''));else n=parseFloat(raw.replace(',','.'));
    const u=(m[2]||'').toLowerCase();
    if(/^(luca|lucas|mil|k)$/.test(u))n*=1000;else if(/^(palo|palos|mill)/.test(u))n*=1e6;else if(n<100)n*=1000;
    n=Math.round(n);if(!n)continue;
    let d=(p.slice(0,m.index)+' '+p.slice(m.index+m[0].length)).replace(STOP,' ').replace(/[$]/g,'').replace(/\s+/g,' ').trim();
    const full=carryRaw+' '+p;
    if(carry){d=carry+(d?', '+d:'');carry='';carryRaw=''}
    items.push(classify(full,text,pieces.length===1,{amount:n,desc:cap1(d),cat:guessCat(d||p),date,type:'expense'}));
  }
  return items;
}

/* ===================== Navegación y vistas ===================== */
let TAB='hoy',FILT='all',RANGE='per',LOCK=false;
function go(t){TAB=t;render();window.scrollTo(0,0);const v=$('#v-'+t);v.classList.remove('fade');void v.offsetWidth;v.classList.add('fade')}
let ANIM_UNTIL=0,RT=null;
function render(){
  if(!S.setup){onboarding();return}
  if(TAB==='hoy'&&Date.now()<ANIM_UNTIL){clearTimeout(RT);RT=setTimeout(render,ANIM_UNTIL-Date.now()+30);return}
  const c=calc();logDay(c);
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden',v.id!=='v-'+TAB));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));
  const alert=loanAlerts(c.t).some(l=>dayDiff(l.due,c.t)<=3)||S.bills.some(b=>!billPaid(b,c.P)&&b.amount>0&&dayDiff(billDue(b,c.P),c.t)<=3);
  const cb=document.querySelector('nav.tabs button[data-t="cue"]');if(cb)cb.classList.toggle('alert',alert);
  $('#date').textContent=cap1(DIA[new Date().getDay()])+' '+nice(c.t);
  ({hoy:renderHoy,mov:renderMov,cue:renderCue,aju:renderAju})[TAB](c);
}

function itemHTML(m){
  const plus=m.type==='income'||((m.type==='adjust'||m.type==='loan')&&m.amount>0);
  const ic=m.type==='loan'?tile('Transporte',ico('arrows-left-right')):m.type==='income'?tile('Supermercado',ico('hand-coins')):m.type==='save'?tile('Compras',ico('piggy-bank')):m.identified===false?tile('Otros',ico('question')):tile(m.cat);
  const src={voz:'por voz',boleta:'con boleta',cuenta:'cuenta mensual',ajuste:'ajuste de saldo'}[m.src];
  const sub=[m.type==='loan'?'Préstamo':m.type==='save'?'Para tu meta':m.type==='income'?'Ingreso':m.cat,src].filter(Boolean).join(', ');
  return `<div class="it" onclick="openMov('${m.id}')">${ic}<div class="tx"><b>${esc(m.desc||m.cat)}</b><span class="small muted">${esc(sub)}</span></div><div class="num ${plus?'pos':''}">${m.type==='save'?'':plus?'+':'−'}${money(Math.abs(m.amount))}</div></div>`;
}
const recent=n=>[...S.movements].sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,n);

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let INTRO=true,SHOWN=null,CNT=null;
function countTo(el,from,to,ms){
  cancelAnimationFrame(CNT);if(RM||from===to){el.textContent=money(to);return}
  const t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=money(from+(to-from)*e);if(k<1)CNT=requestAnimationFrame(step)};
  CNT=requestAnimationFrame(step);
}
function coins(hero,value){
  // Una moneda por cada luca disponible hoy, entre 3 y 28
  const n=Math.max(3,Math.min(28,Math.round(value/1000)));
  const amt=hero.querySelector('.amount'),y=amt.offsetTop+amt.offsetHeight*0.55+36,w=hero.clientWidth;
  for(let k=0;k<n;k++){
    const c=document.createElement('span');c.className='coin';c.textContent='$';
    c.style.setProperty('--x',(14+Math.random()*(w-54))+'px');
    c.style.setProperty('--y',(y+(Math.random()*16-8))+'px');
    c.style.setProperty('--r',(Math.random()*300-150)+'deg');
    c.style.setProperty('--d',(k*Math.min(45,600/n))+'ms');
    hero.appendChild(c);setTimeout(()=>c.remove(),2200+k*45);
  }
  return Math.min(600,n*45)+700;
}
function dayDots(c){
  const out=[];
  for(let d=c.P.start;d<=c.P.end;d=addDays(d,1)){
    let k='',lab=nice(d);
    if(d<c.t){if(d<S.created)k='off';else{const L=S.dayLog[d],sp=discOn(d);k=L?(sp<=L.plan+1?'ok':'over'):(sp===0?'ok':'over')}}
    else if(d===c.t)k='today'+(c.left<-0.5?' bad':'');
    out.push(`<span class="${k}" title="${lab}"></span>`);
  }
  return out.join('');
}
function projection(c){
  // Cómo cierras el período si sigues gastando como hasta ahora
  const since=S.created>c.P.start?S.created:c.P.start,days=dayDiff(c.t,since);
  let avg=days>=2?sum(S.movements.filter(m=>m.type==='expense'&&!m.billId&&m.date>=since&&m.date<c.t),m=>m.amount)/days:c.plan;
  const restToday=Math.max(0,avg-c.todayDisc);
  return S.balance-c.pending-c.debt-restToday-avg*(c.P.left-1);
}

function dueClass(due,t){const d=dayDiff(due,t);return d<0?'late':d<=3?'soon':''}
function dueText(due,t){const d=dayDiff(due,t);return d<0?`venció hace ${-d} ${d===-1?'día':'días'}`:d===0?'vence hoy':d===1?'vence mañana':d<=3?`vence en ${d} días`:`vence el ${nice(due)}`}

function renderMov(c){
  const P=c.P,inP=m=>m.date>=P.start&&m.date<=P.end;
  const pm=S.movements.filter(inP);
  const outs=pm.filter(m=>m.type==='expense'||(m.type==='adjust'&&m.amount<0));
  const total=sum(outs,m=>Math.abs(m.amount));
  const bills=sum(outs.filter(m=>m.billId),m=>m.amount);
  const unk=sum(outs.filter(m=>m.identified===false),m=>Math.abs(m.amount));
  const byCat={};outs.forEach(m=>{const k=m.identified===false?'Sin identificar':m.cat;byCat[k]=(byCat[k]||0)+Math.abs(m.amount)});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const mx=cats.length?cats[0][1]:1;
  const disc=sum(outs.filter(m=>m.type==='expense'&&!m.billId),m=>m.amount);
  let insight='';
  const since=S.created>P.start?S.created:P.start, nd=dayDiff(c.t,since)+1;
  if(nd>=3&&disc>0){
    const avg=disc/nd;
    insight=`En promedio gastas ${money(avg)} al día fuera de cuentas; tu plan de hoy es ${money(c.plan)}.`;
    const wd={};S.movements.filter(m=>m.type==='expense'&&!m.billId&&m.date>=addDays(c.t,-60)).forEach(m=>{const d=parseYmd(m.date).getDay();(wd[d]=wd[d]||{}),wd[d][m.date]=(wd[d][m.date]||0)+m.amount});
    const avgs=Object.entries(wd).map(([d,o])=>[d,sum(Object.values(o),x=>x)/Object.keys(o).length,Object.keys(o).length]).filter(x=>x[2]>=2);
    if(avgs.length>=3){const top=avgs.sort((a,b)=>b[1]-a[1])[0];const rest=avgs.slice(1);const ra=sum(rest,x=>x[1])/rest.length;if(top[1]>ra*1.3)insight+=` Los ${DIA[top[0]]} sueles gastar ${Math.round((top[1]/ra-1)*100)}% más que el resto de la semana.`}
  }
  let list=RANGE==='per'?pm:S.movements;
  if(FILT==='Ingreso')list=list.filter(m=>m.type==='income'||(m.type==='adjust'&&m.amount>0));
  else if(FILT==='Sin identificar')list=list.filter(m=>m.identified===false);
  else if(FILT==='Meta')list=list.filter(m=>m.type==='save');
  else if(FILT==='Préstamos')list=list.filter(m=>m.type==='loan');
  else if(FILT!=='all')list=list.filter(m=>m.cat===FILT&&m.type!=='income'&&m.type!=='loan'&&m.identified!==false);
  list=[...list].sort((a,b)=>a.date===b.date?(b.at||0)-(a.at||0):(a.date<b.date?1:-1));
  const groups={};list.forEach(m=>(groups[m.date]=groups[m.date]||[]).push(m));
  const present=new Set(S.movements.map(m=>m.cat));
  const chips=[['all','Todo'],...CATS.filter(x=>present.has(x[0])).map(x=>[x[0],x[0]]),['Ingreso','Ingresos'],['Meta','Apartado'],['Préstamos','Préstamos'],['Sin identificar','Sin identificar']];
  const dl=d=>d===c.t?'Hoy':d===addDays(c.t,-1)?'Ayer':cap1(DIA[parseYmd(d).getDay()])+' '+nice(d);
  $('#v-mov').innerHTML=`<div class="cols"><div><section class="card">
      <h2>Este período</h2><div class="small muted" style="margin:-6px 0 10px">Del ${nice(P.start)} al ${nice(P.end)}</div>
      <div class="stats"><div><span class="small muted">Gastado</span><b>${money(total)}</b></div><div><span class="small muted">En cuentas</span><b>${money(bills)}</b></div><div><span class="small muted">Sin identificar</span><b>${money(unk)}</b></div></div>
      ${cats.length?cats.map(([k,v])=>`<div class="catrow">${k==='Sin identificar'?tile('Otros',ico('question')):tile(k)}<div class="cr"><div class="row small"><span>${esc(k)}</span><span class="num">${money(v)}<small>${Math.round(v/total*100)}%</small></span></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div></div>`).join(''):`<div class="empty small">Aún no hay gastos en este período. ¡Buen comienzo!</div>`}
    </section>${adviceHTML(c,insight)}</div><div>
      ${calendarHTML(c)}
      ${dailyChart(c)}
      <div class="chips" role="tablist">${[['per','Este período'],['all','Todo el historial']].map(([k,l])=>`<button class="${RANGE===k?'on':''}" onclick="RANGE='${k}';render()">${l}</button>`).join('')}</div>
      <div class="chips">${chips.map(([k,l])=>`<button class="${FILT===k?'on':''}" onclick="FILT='${esc(k)}';render()">${esc(l)}</button>`).join('')}</div>
      ${Object.keys(groups).length?Object.entries(groups).map(([d,ms])=>{const out=sum(ms.filter(m=>m.type==='expense'||(m.type==='adjust'&&m.amount<0)),m=>Math.abs(m.amount));return `<div class="dayhead"><span>${dl(d)}</span><span>${out?money(out):''}</span></div><div class="card" style="padding:4px 14px">${ms.map(itemHTML).join('')}</div>`}).join(''):`<div class="card empty small">No hay movimientos con este filtro.</div>`}
    </div></div>`;
  wireChart();
}

/* ----- Análisis y consejos (educación financiera) ----- */
const NEED=['Cuentas','Supermercado','Salud','Transporte','Hogar'];
// Qué tan fácil es recortar cada categoría (0 = no se toca)
const FLEX={'Comida fuera':1,'Ocio':1,'Compras':1,'Otros':.7,'Hogar':.4,'Transporte':.3,'Supermercado':.3};
const TIPS=[
 'Fondo de emergencia: lo ideal es juntar entre 3 y 6 meses de gastos básicos para imprevistos.',
 'Págate primero: aparta tu ahorro apenas recibes el sueldo, no con lo que sobre a fin de mes.',
 'Regla de las 24 horas: antes de una compra no planificada, espera un día. Muchas veces las ganas se pasan.',
 'Las cuotas "sin interés" igual comprometen tu sueldo de los próximos meses: anótalas como cuentas.',
 'Revisa tus suscripciones de vez en cuando: es común seguir pagando servicios que ya no usas.',
 'Pagar solo el mínimo de la tarjeta sale caro: los intereses se cobran sobre todo lo que queda.',
 'En el súper, compara el precio por kilo o por litro: el envase grande no siempre es más barato.',
 'Una meta con nombre y fecha es mucho más fácil de cumplir que "ahorrar más".',
 'Anotar cada gasto, aunque sea chico, ya ayuda a gastar menos: lo que se mide, se cuida.',
 'Ir al súper con lista y sin hambre reduce las compras por impulso.',
 'Un ahorro automático, aunque sea pequeño, le gana a uno grande que nunca empieza.',
 'Antes de pedir un préstamo, mira el costo total (CAE), no solo el valor de la cuota.'
];
function advice(c,weekday){
  const P=c.P,since=S.created>P.start?S.created:P.start,nd=dayDiff(c.t,since)+1,out=[];
  if(nd<3)return out;
  const exp=S.movements.filter(m=>m.type==='expense'&&!m.billId&&m.date>=since&&m.date<=c.t);
  const byCat={};exp.forEach(m=>byCat[m.cat]=(byCat[m.cat]||0)+m.amount);
  // 1. ¿Llego a la meta? Si no, cuánto recortar y dónde
  const proj=projection(c),goal=c.goalNow,L=Math.max(1,c.P.left);
  if(goal>0&&proj<goal){
    const gap=goal-proj;
    const cand=Object.entries(byCat).filter(([k])=>FLEX[k]).map(([k,v])=>{const daily=v/nd;return{k,daily,room:daily*L*.5,w:daily*L*FLEX[k]}}).filter(x=>x.room>=500).sort((a,b)=>b.w-a.w).slice(0,3);
    const W=sum(cand,x=>x.w),cuts=cand.map(x=>({...x,cut:Math.min(x.room,gap*x.w/W)})).filter(x=>x.cut>=300),got=sum(cuts,x=>x.cut);
    out.push({ic:'target',c:'c1',t:`Te faltan ${money(gap)} para tu meta`,b:`Si sigues como vas, cierras el período con ${money(Math.max(0,proj))}.`+(cuts.length?` Una forma de llegar:<ul>${cuts.map(x=>`<li><b>${esc(x.k)}</b>: de ${money(x.daily*7)} a ${money(Math.max(0,x.daily*7-x.cut/L*7))} por semana</li>`).join('')}</ul>${got<gap-500?`Con eso juntas ${money(got)}. Para el resto podrías ajustar la meta: una meta alcanzable motiva más que una imposible.`:''}`:' Revisa si la meta es alcanzable este período; está bien ajustarla.')});
  }else if(goal>0)out.push({ic:'check-circle',c:'c0',t:'Vas camino a tu meta',b:`A este ritmo cierras con ${money(proj)}, ${money(proj-goal)} sobre lo que te propusiste. Si quieres, aparta ese extra ahora, antes de que se gaste solo.`});
  // 2. Gastos hormiga
  const ants=exp.filter(m=>m.amount<=5000);
  if(ants.length>=4){const tot=sum(ants,m=>m.amount),mo=tot/nd*30;
    out.push({ic:'coins',c:'c6',t:'Gastos hormiga',b:`Hiciste ${ants.length} compras de menos de $5.000 que suman ${money(tot)}. Parecen poco, pero a este ritmo son unos ${money(mo)} al mes y ${money(mo*12)} al año.`})}
  // 3. Comparación con el período anterior, a la misma altura
  const pp=period(addDays(P.start,-1));
  if(S.created<=pp.start){
    const pe=addDays(pp.start,dayDiff(c.t,P.start)),prev={};
    S.movements.filter(m=>m.type==='expense'&&!m.billId&&m.date>=pp.start&&m.date<=pe).forEach(m=>prev[m.cat]=(prev[m.cat]||0)+m.amount);
    let up=null,dn=null;
    for(const k of new Set([...Object.keys(byCat),...Object.keys(prev)])){const a=byCat[k]||0,b=prev[k]||0,d=a-b;
      if(b>=3000&&d>=3000&&(!up||d>up.d))up={k,d,p:a/b-1};
      if(b>=3000&&-d>=3000&&(!dn||-d>dn.d))dn={k,d:-d,p:1-a/b}}
    if(up)out.push({ic:'trend-up',c:'c3',t:`${up.k} subió ${Math.round(up.p*100)}%`,b:`Llevas ${money(byCat[up.k])} en ${up.k.toLowerCase()}, ${money(up.d)} más que a esta altura del período anterior. ¿Fue algo puntual o se está volviendo costumbre?`});
    if(dn)out.push({ic:'trend-down',c:'c0',t:`¡${dn.k} bajó ${Math.round(dn.p*100)}%!`,b:`Gastaste ${money(dn.d)} menos que a esta altura del período anterior. Eso es plata que queda para tu meta.`});
  }
  // 4. Regla 50/30/20 sobre los ingresos del período
  const inc=sum(S.movements.filter(m=>m.type==='income'&&m.date>=P.start&&m.date<=P.end),m=>m.amount);
  if(inc>0){
    // Se proyecta el período completo al ritmo actual; el ahorro es lo que queda del ingreso
    const pdays=dayDiff(P.end,P.start)+1,k=pdays/nd;
    const billsT=sum(S.movements.filter(m=>m.billId&&m.date>=P.start&&m.date<=P.end),m=>m.amount)+c.pending;
    const need=billsT+sum(exp.filter(m=>NEED.includes(m.cat)),m=>m.amount)*k,want=sum(exp.filter(m=>!NEED.includes(m.cat)),m=>m.amount)*k,save=Math.max(0,inc-need-want);
    const pc=v=>Math.round(v/Math.max(inc,need+want)*100),seg=[[need,'c2'],[want,'c1'],[save,'c0']];
    out.push({ic:'scales',c:'c4',t:'Regla 50/30/20',b:`Una guía muy usada: 50% de tus ingresos a necesidades, 30% a gustos y 20% a ahorro. Con ingresos de ${money(inc)}, si sigues a este ritmo, el período cerraría así:
      <div class="split">${seg.map(([v,k])=>v>0?`<i class="${k}" style="flex:${v}"></i>`:'').join('')}</div>
      <div class="legend" style="margin:0"><span><i class="dot c2"></i>Necesidades ${pc(need)}% <span class="muted">(guía 50%)</span></span><span><i class="dot c1"></i>Gustos ${pc(want)}% <span class="muted">(guía 30%)</span></span><span><i class="dot c0"></i>Ahorro ${pc(save)}% <span class="muted">(guía 20%)</span></span></div>`});
  }
  if(weekday)out.push({ic:'calendar-check',c:'c7',t:'Tu ritmo',b:weekday});
  return out;
}
function adviceHTML(c,weekday){
  const a=advice(c,weekday),tip=TIPS[Math.floor(parseYmd(c.t)/864e5)%TIPS.length];
  return `<section class="card"><h2>Consejos para ti</h2>
    ${a.length?a.map(x=>`<div class="adv">${tile(CATS[+x.c.slice(1)][0],ico(x.ic))}<div><b>${x.t}</b><div class="small">${x.b}</div></div></div>`).join(''):`<p class="small muted" style="margin:0 0 6px">Con unos días más de registros podré analizar tus gastos y darte consejos personalizados.</p>`}
    <div class="note good" style="display:flex;gap:10px;align-items:flex-start">${ico('lightbulb')}<span><b>¿Sabías que?</b> ${tip}</span></div>
  </section>`;
}

/* ----- Calendario del mes ----- */
let CALM=null,CALSEL=null;
// Todo lo que pasa en un día: gasto, plan, ingresos, cuentas y préstamos
function dayInfo(d,c){
  const ms=S.movements.filter(m=>m.date===d);
  const spent=discOn(d),L=S.dayLog[d];
  let st='';
  if(d===c.t)st=c.left<-0.5?'over':spent>0||c.used>0?'ok':'';
  else if(d<c.t&&d>=S.created)st=(L?spent<=L.plan+1:spent===0)?'ok':'over';
  const plan=d===c.t?c.plan:L?L.plan:null;
  const inc=ms.filter(m=>m.type==='income'||(m.type==='adjust'&&m.amount>0)),paid=ms.filter(m=>m.billId);
  const P=period(d),due=S.bills.filter(b=>billDue(b,P)===d&&!billPaid(b,P)&&b.amount>0);
  const loans=S.loans.filter(l=>l.due===d&&loanLeft(l)>0);
  return{d,ms,spent,plan,st,inc,paid,due,loans,P};
}
const short=n=>n>=1e6?(n/1e6).toLocaleString('es-CL',{maximumFractionDigits:1})+' M':n>=1000?Math.round(n/1000)+' mil':'$'+Math.round(n);

/* ----- Gráfico: gasto de cada día del período frente al plan ----- */
const kmoney=n=>n>=1e6?'$'+(n/1e6).toLocaleString('es-CL',{maximumFractionDigits:1})+' M':n>=1000?'$'+Math.round(n/1000).toLocaleString('es-CL')+' mil':'$'+Math.round(n);
let DC=[];
function dailyChart(c){
  const pts=[];
  for(let d=c.P.start;d<=c.P.end;d=addDays(d,1)){
    const fut=d>c.t,pre=d<S.created,v=fut||pre?0:discOn(d),L=S.dayLog[d];
    const plan=d===c.t?c.plan:L?L.plan:fut?c.tomorrow:null;
    pts.push({d,v,plan,fut,pre,over:!fut&&plan!=null&&v>plan+1});
  }
  DC=pts;
  const max=Math.max(1,...pts.map(p=>Math.max(p.v,p.plan||0)));
  const mag=Math.pow(10,Math.floor(Math.log10(max/3))),step=[1,2,2.5,5,10].find(s=>s*mag>=max/3)*mag,top=Math.ceil(max/step)*step;
  const h=n=>Math.min(100,n/top*100);
  const grid=[];for(let y=0;y<=top+.5;y+=step)grid.push(`<div class="dc-gl${y===0?' base':''}" style="bottom:${h(y)}%"><span>${y?kmoney(y):'$0'}</span></div>`);
  const cols=pts.map((p,i)=>`<div class="dc-col${p.fut?' fut':''}" data-i="${i}">${p.v>0?`<i class="dc-bar${p.over?' over':''}" style="height:${h(p.v)}%"></i>`:''}${p.plan!=null&&!p.pre?`<b class="dc-plan" style="bottom:${h(p.plan)}%"></b>`:''}</div>`).join('');
  const past=pts.filter(p=>!p.fut&&!p.pre),ok=past.filter(p=>!p.over).length;
  const todayPos=(pts.findIndex(p=>p.d===c.t)+.5)/pts.length;
  const rows=past.map(p=>`<tr><td>${nice(p.d)}</td><td>${money(p.v)}</td><td>${p.plan!=null?money(p.plan):'—'}</td></tr>`).join('');
  return `<section class="card">
    <h2>Tu gasto día a día</h2>
    <div class="small muted" style="margin:-6px 0 10px">${past.length?`${ok} de ${past.length} ${past.length===1?'día':'días'} dentro de tu plan`:'Aún no hay días registrados en este período'}. Sin contar cuentas mensuales.</div>
    <div class="legend"><span><i></i>Dentro del plan</span><span><i class="over"></i>Sobre el plan</span><span><i class="plan"></i>Plan del día</span></div>
    <div class="dchart" id="dchart" tabindex="0" aria-label="Gráfico de gasto diario. Usa las flechas para recorrer los días.">
      ${grid.join('')}<div class="dc-cols">${cols}</div><div class="dc-tip" id="dcTip" hidden></div>
    </div>
    <div class="dc-x"><span>${nice(c.P.start)}</span>${todayPos>.15&&todayPos<.85?`<span class="dc-today" style="left:${todayPos*100}%">Hoy</span>`:''}<span>${nice(c.P.end)}</span></div>
    <table class="sr"><caption>Gasto diario frente al plan</caption><tr><th>Día</th><th>Gastado</th><th>Plan</th></tr>${rows}</table>
  </section>`;
}
function wireChart(){
  const el=$('#dchart');if(!el)return;
  const cols=el.querySelectorAll('.dc-col'),tip=$('#dcTip');
  let cur=-1;
  const show=i=>{
    if(i<0||i>=DC.length)return;cur=i;const p=DC[i];
    cols.forEach((c,k)=>c.classList.toggle('hov',k===i));
    const st=p.fut?'Día por venir':p.pre?'Antes de empezar a usar la app':p.over?'Sobre el plan':'Dentro del plan';
    tip.innerHTML=`<b>${p.d===todayStr()?'Hoy':cap1(DIA[parseYmd(p.d).getDay()])} ${nice(p.d)}</b>${p.fut?'':`Gastado: ${money(p.v)}<br>`}${p.plan!=null&&!p.pre?`Plan: ${money(p.plan)}<br>`:''}${st}`;
    tip.hidden=false;
    const r=cols[i].getBoundingClientRect(),b=el.getBoundingClientRect(),w=tip.offsetWidth;
    tip.style.left=Math.max(w/2-52,Math.min(b.width-w/2+8,r.left-b.left+r.width/2))+'px';
  };
  const hide=()=>{cur=-1;tip.hidden=true;cols.forEach(c=>c.classList.remove('hov'))};
  const at=x=>{const b=el.getBoundingClientRect();return Math.floor((x-b.left)/b.width*DC.length)};
  el.addEventListener('pointermove',e=>show(at(e.clientX)));
  el.addEventListener('pointerdown',e=>show(at(e.clientX)));
  el.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hide()});
  el.addEventListener('focus',()=>show(Math.max(0,DC.findIndex(p=>p.d===todayStr()))));
  el.addEventListener('blur',hide);
  el.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();show(Math.max(0,Math.min(DC.length-1,cur+(e.key==='ArrowRight'?1:-1))))}});
}

function loanDueTxt(l,t){const d=dayDiff(l.due,t);return d<0?`venció hace ${-d} ${d===-1?'día':'días'}`:d===0?'vence hoy':d===1?'vence mañana':d<=7?`vence en ${d} días`:`vence el ${nice(l.due)}`}
function loanAlerts(t){return S.loans.filter(l=>loanLeft(l)>0&&dayDiff(l.due,t)<=7).sort((a,b)=>a.due<b.due?-1:1)}
function loanCardHTML(c){

    ${c.debt?`<div class="small muted" style="margin-top:8px">Lo que debes se reserva de tu saldo, así tu plan diario no lo gasta.</div>`:''}

function loanRow(l,t){
  const left=loanLeft(l),paid=l.amount-left,done=left<=0,d=dayDiff(l.due,t);

function voiceFallback(msg){
  const st=$('#micSt');if(!st)return;

function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){voiceFallback('Este navegador no permite dictar dentro de la app. Usa el micrófono de tu teclado: funciona igual.');return}
  if(REC){stopListen();return}
  const iOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
  let finalT='',errored=false,started=false;
  try{REC=new SR()}catch(e){voiceFallback('El dictado no está disponible en este teléfono.');return}
  REC.lang='es-CL';REC.interimResults=true;REC.maxAlternatives=1;
  $('#mic').classList.add('rec');$('#micSt').textContent='Activando el micrófono…';
  const guard=setTimeout(()=>{if(!started){errored=true;stopListen();REC=null;const m=$('#mic');if(m)m.classList.remove('rec');
    voiceFallback('El dictado no respondió en este teléfono. Puedes usar el micrófono del teclado.')}},4000);
  REC.onstart=()=>{started=true;clearTimeout(guard);const st=$('#micSt');if(st)st.textContent='Te escucho… habla ahora.'};
  REC.onresult=e=>{let tmp='';for(const r of e.results){if(r.isFinal)finalT=r[0].transcript;else tmp+=r[0].transcript}const st=$('#micSt');if(st)st.textContent=finalT||tmp||'Te escucho…'};
  REC.onerror=e=>{errored=true;clearTimeout(guard);
    const msgs={'not-allowed':'El teléfono no dio permiso al micrófono. Revisa los permisos del navegador para este sitio.',
      'service-not-allowed':iOS?'En iPhone el dictado a veces no funciona con la app instalada. Ábrela en Safari o usa el micrófono del teclado.':'El servicio de dictado está desactivado en este teléfono.',
      'audio-capture':'No se encontró un micrófono disponible. Puede que otra app lo esté usando.',
      'network':'El dictado necesita internet y los servicios de voz de Google.',
      'no-speech':'No escuché nada. Toca el micrófono y habla apenas se ponga rojo.',
      'language-not-supported':'Este teléfono no tiene dictado en español instalado.'};
    voiceFallback(msgs[e.error]||'No pude usar el dictado ('+e.error+').')};
  REC.onend=()=>{clearTimeout(guard);const m=$('#mic');if(m)m.classList.remove('rec');REC=null;
    if(finalT){CAP.text=finalT;const items=parse(finalT);
      if(items.length){CAP.rows.push(...items);drawCapture(false)}
      else{drawCapture(false);$('#micSt').textContent='Entendí «'+finalT+'», pero no un monto. Di el valor, por ejemplo «18 lucas».'}}
    else if(!errored)voiceFallback('No escuché nada. Toca el micrófono y habla apenas se ponga rojo.')};
  try{REC.start()}catch(e){clearTimeout(guard);REC=null;$('#mic').classList.remove('rec');voiceFallback('No se pudo activar el dictado. Puedes usar el micrófono del teclado.')}
}

function compress(file,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);res(cv.toDataURL('image/jpeg',q))};
  im.onerror=()=>rej(new Error('img'));im.src=u})}

/* ----- Preparar la foto: recortar la boleta, pasar a gris y subir el contraste ----- */
async function prepReceipt(src){
  const im=await loadImg(src);
  // 1. Buscar el papel (zona clara) en una versión chica de la foto
  const sw=200,sh=Math.round(im.height*sw/im.width),sc=document.createElement('canvas');sc.width=sw;sc.height=sh;
  const sx=sc.getContext('2d');sx.drawImage(im,0,0,sw,sh);
  const sd=sx.getImageData(0,0,sw,sh).data,g=new Uint8Array(sw*sh),hist=new Array(256).fill(0);
  for(let i=0;i<sw*sh;i++){const v=(sd[i*4]*.299+sd[i*4+1]*.587+sd[i*4+2]*.114)|0;g[i]=v;hist[v]++}
  // Umbral de Otsu: separa papel claro del fondo
  let tot=sw*sh,sumA=0;for(let i=0;i<256;i++)sumA+=i*hist[i];
  let sB=0,wB=0,best=0,th=128;
  for(let i=0;i<256;i++){wB+=hist[i];if(!wB)continue;const wF=tot-wB;if(!wF)break;sB+=i*hist[i];const mB=sB/wB,mF=(sumA-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>best){best=v;th=i}}
  const rows=new Array(sh).fill(0),cols=new Array(sw).fill(0);
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++)if(g[y*sw+x]>th){rows[y]++;cols[x]++}
  const span=(a,n,f)=>{let s=a.findIndex(v=>v>n*f),e=a.length-1-[...a].reverse().findIndex(v=>v>n*f);return s<0?[0,a.length-1]:[s,e]};
  let[x0,x1]=span(cols,sh,.2),[y0,y1]=span(rows,sw,.2);
  const k=im.width/sw,area=(x1-x0)*(y1-y0)/(sw*sh);
  if(area<.08||area>.92){x0=0;y0=0;x1=sw-1;y1=sh-1}         // no se ve un papel claro: usar la foto entera
  const m=4;x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(sw-1,x1+m);y1=Math.min(sh-1,y1+m);
  const cx=x0*k,cy=y0*k,cw=(x1-x0+1)*k,ch=(y1-y0+1)*k;
  // 2. Recortar y ampliar: el texto de la boleta queda de un tamaño que el lector entiende mejor
  const W=Math.min(2000,Math.max(1400,cw)),H=Math.round(ch*W/cw),cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const cx2=cv.getContext('2d');cx2.drawImage(im,cx,cy,cw,ch,0,0,W,H);
  const id=cx2.getImageData(0,0,W,H),d=id.data,h2=new Array(256).fill(0);
  for(let i=0;i<d.length;i+=4){const v=(d[i]*.299+d[i+1]*.587+d[i+2]*.114)|0;d[i]=v;h2[v]++}
  // 3. Estirar el contraste (papel térmico gris y tinta pálida)
  const n=W*H;let lo=0,hi=255,acc=0;
  for(let i=0;i<256;i++){acc+=h2[i];if(acc>n*.01){lo=i;break}}
  acc=0;for(let i=255;i>=0;i--){acc+=h2[i];if(acc>n*.08){hi=i;break}}
  const r=Math.max(1,hi-lo);
  for(let i=0;i<d.length;i+=4){let v=(d[i]-lo)*255/r;v=v<0?0:v>255?255:v;v=255*Math.pow(v/255,1.4);d[i]=d[i+1]=d[i+2]=v}
  cx2.putImageData(id,0,0);
  return cv.toDataURL('image/jpeg',.92);
}

/* ----- Entender el texto leído ----- */
const RC_TOTAL=/(?:^|[^a-z])(?:[t7][o0][t7][a4][l1i|!]|tota|total|t[o0]tal|[il1|][o0]t[a4][l1i|])/i;
const RC_PAY=/(monto|a\s*pagar|importe|valor\s*total|tot\.)/i;
const RC_SKIP=/(sub\s*-?\s*t|iva|neto|propina|vuelto|cambio|descuento|exento|cuota|saldo|ahorr|n[°º]|folio|rut|aprob|comprob|terminal|c[oó]digo)/i;
const RC_PROC=/(getnet|transbank|redcompra|red\s*compra|webpay|mercado\s*pago|sumup|klap|compra|v[aá]lido|boleta|factura|electr[oó]nica|copia|cliente|visa|master|d[eé]bito|cr[eé]dito|tarjeta|aprobaci|comprobante|terminal|fecha|hora|rut|giro|direcc|tel[eé]fono|www|\.cl|sii|caja|cajero|vendedor|local|n[°º])/i;
function rcNums(line){
  // Corregir confusiones típicas del lector dentro de los números: O→0, D→0, l/I→1, S/$ delante
  const L=line.replace(/(?<=[\d.,])[OoDQ]|[OoDQ](?=[\d.,]*\d)/g,'0').replace(/(?<=[\d.,])[lI|]|[lI|](?=[.,]?\d{3})/g,'1');
  const out=[];
  for(const m of L.matchAll(/([$S5]?)\s?(\d{1,3}(?:[.,]\d{3})+|\d{4,7})(?![\d]|[.,]\d)/g)){
    const raw=m[2],n=Number(raw.replace(/[.,]/g,''));if(n<100||n>=5e6)continue;
    // "$38.000" leído como "538.000": las boletas chilenas siempre imprimen "$", así que si en la
    // línea no aparece ninguno y el número parte con 5, lo más probable es que ese 5 sea el signo
    const dollar5=m[1]===''&&/^5\d{1,3}[.,]\d{3}/.test(raw)&&!/\$/.test(line);
    if(dollar5){const alt=Number(raw.slice(1).replace(/[.,]/g,''));if(alt>=100)out.push({n:alt,cur:true});out.push({n,cur:false,alt:true});continue}
    out.push({n,cur:m[1]==='$'||m[1]==='S'});
  }
  return out;
}
function parseReceipt(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const score={};
  const add=(n,w)=>{score[n]=(score[n]||0)+w};
  lines.forEach((l,i)=>{
    if(RC_SKIP.test(l)&&!RC_TOTAL.test(l))return;
    const isT=RC_TOTAL.test(l)&&!/sub\s*-?\s*t/i.test(l),isP=RC_PAY.test(l);
    if(!isT&&!isP)return;
    let ns=rcNums(l);
    if(!ns.length&&lines[i+1])ns=rcNums(lines[i+1]);          // el monto a veces queda en la línea siguiente
    ns.forEach(x=>add(x.n,(isT?3:2)*(x.alt?.6:1)+(x.cur?.5:0)));
  });
  // Si "Total" quedó ilegible: usar montos con $ o montos solos al final de una línea (sin IVA)
  if(!Object.keys(score).length)lines.forEach(l=>{if(/iva|neto|rut|aprob|comprob|incluid/i.test(l))return;
    const end=/[\s:][$S5]?\s?(\d{1,3}(?:[.,]\d{3})+)\s*$/.test(l);
    rcNums(l).forEach(x=>{if(x.cur||end)add(x.n,(x.alt?.6:1)*(end?1:.7))})});
  const ranked=Object.entries(score).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  const total=ranked.length?Number(ranked[0][0]):0;
  // Fecha dd/mm/aaaa
  let date='';const dm=text.match(/(\d{1,2})\s?[\/\-.]\s?(\d{1,2})\s?[\/\-.]\s?(20\d{2}|\d{2})(?!\d)/);
  if(dm){const y=+dm[3]<100?2000+ +dm[3]:+dm[3],d=new Date(y,+dm[2]-1,+dm[1]);
    if(d.getDate()===+dm[1]&&d.getMonth()===+dm[2]-1){const s=ymd(d);if(s<=todayStr()&&dayDiff(todayStr(),s)<=400)date=s}}
  // Comercio: la razón social o el primer nombre que no sea de la máquina de pago
  const clean=l=>l.replace(/[^\wáéíóúñÁÉÍÓÚÑ .&-]/g,' ').replace(/\s+/g,' ').trim();
  const cands=lines.map(clean).filter(l=>/[a-záéíóúñ]{3,}/i.test(l)&&!RC_PROC.test(l)&&!/\d{3,}/.test(l)&&l.length<=60);
  let shop=cands.find(l=>/(sociedad|comercial|ltda|spa|s\.?a\.?$|limitada|empresa|inversiones)/i.test(l))||cands[0]||'';
  shop=shop.replace(/\b(sociedad|comercial(izadora)?|inversiones|empresa|ltda|limitada|spa|s\.?a\.?)\b/gi,'').replace(/\by\s+c(ia|om?pa[nñ]?[ií]?a?)?\.?\s*$/i,'').replace(/(\s+(y|[a-z]))+\s*$/i,'').replace(/\s+/g,' ').trim();
  return{total,shop,date,alts:ranked.slice(1,3).map(x=>+x[0])};
}

let OCRW=null,OCRLOG=null;
async function ocrWorker(log){
  if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  OCRLOG=log;if(!OCRW)OCRW=Tesseract.createWorker('spa',1,{logger:m=>OCRLOG&&OCRLOG(m)});
  return OCRW;
}
async function ocr(){
  const st=()=>$('#ocrSt');if(!CAP.full)return;
  const say=t=>{const e=st();if(e)e.innerHTML=t};
  say('Leyendo la boleta… La primera vez descarga el lector (unos MB), necesitas internet.');
  const img=CAP.full;
  try{
    let pct=0;
    const w=await ocrWorker(m=>{if(m.status==='recognizing text'&&CAP.full===img){pct=Math.round(m.progress*100);say(`Leyendo la boleta… ${pct}%`)}});
    const prepped=await prepReceipt(img);
    // Varios intentos: boleta como columna de texto, como bloque y la foto original
    const tries=[[prepped,'4'],[prepped,'6'],[img,'4']];
    let best=null,texts=[];
    for(const[src,psm]of tries){
      await w.setParameters({tessedit_pageseg_mode:psm,preserve_interword_spaces:'1'});
      const r=await w.recognize(src);texts.push(r.data.text||'');
      const p=parseReceipt(r.data.text||'');
      if(!best||(!best.total&&p.total))best=p;
      if(best.total&&best.shop&&best.date)break;
      if(best.total&&!p.total)break;
    }
    if(CAP.full!==img)return;                                   // cambiaron la foto mientras leía
    const all=texts.join('\n'),merged=parseReceipt(all);
    const res={total:best.total||merged.total,shop:best.shop||merged.shop,date:best.date||merged.date};
    const row=CAP.rows[0]||(CAP.rows[0]={amount:0,desc:'',cat:'Otros',date:todayStr(),type:'expense'});
    if(res.total)row.amount=res.total;
    if(res.shop&&!row.desc)row.desc=cap1(res.shop.toLowerCase());
    if(res.date)row.date=res.date;
    if(row.cat==='Otros'){const c1=guessCat(res.shop||''),c2=c1==='Otros'?guessCat(all):c1;row.cat=c2}
    redrawLines();
    const bits=[res.total?`total <b>${money(res.total)}</b>`:'',res.shop?esc(cap1(res.shop.toLowerCase())):'',res.date?`fecha ${nice(res.date)}${res.date!==todayStr()?' (la dejé como fecha del gasto)':''}`:''].filter(Boolean);
    say(res.total?`Leí: ${bits.join(' · ')}. Revisa que esté bien antes de registrar.`:`No encontré el total${bits.length?` (sí leí: ${bits.join(' · ')})`:''}. Escríbelo a mano o prueba con otra foto: boleta estirada, con buena luz y ocupando casi toda la imagen.`);
  }catch(e){console.error(e);say('No se pudo leer la boleta (¿sin internet?). Escribe el monto a mano.')}
}
function commit(){
  const rows=CAP.rows.filter(r=>r.amount>0);
  if(!rows.length){toast('Indica el monto de al menos una línea.');return}
  // Revisar que cada línea tenga lo necesario antes de guardar nada
  for(const r of rows){
    if(r.type==='bill'&&!S.bills.some(b=>b.id===r.billId)){toast('Elige qué cuenta pagaste, o cámbialo a «Gasto».');return}
    if(r.type==='loan'&&!(r.person||'').trim()){toast('Indica quién te prestó o a quién le prestaste.');return}
    if(r.type==='loanpay'&&!S.loans.some(l=>l.id===r.loanId)){toast('Elige a qué préstamo corresponde el abono.');return}
  }
  const src=CAP.mode==='voice'?'voz':CAP.mode==='photo'?'boleta':'texto';
  const ids=[],newLoans=[];let imgFail=false;
  rows.forEach((r,i)=>{
    const date=r.date||todayStr(),a=r.amount;let m;
    if(r.type==='income')m=addMov({type:'income',amount:a,date,cat:'Ingreso',desc:(r.desc||'').trim()||'Ingreso',src});
    else if(r.type==='save')m=addMov({type:'save',amount:a,date,cat:'Meta',desc:'Apartado para la meta',src});
    else if(r.type==='bill'){const b=S.bills.find(x=>x.id===r.billId),P=period(date),done=billPaid(b,P);
      m=addMov(done?{type:'expense',amount:a,date,cat:'Cuentas',desc:b.name,src}:{type:'expense',amount:a,date,cat:'Cuentas',desc:b.name,billId:b.id,billPeriod:P.key,src:'cuenta'})}
    else if(r.type==='loan'){const person=cap1(r.person.trim()),l={id:uid(),dir:r.dir||'in',person,amount:a,date,due:r.due||addDays(date,30),note:''};S.loans.push(l);newLoans.push(l.id);
      m=addMov({type:'loan',amount:l.dir==='in'?a:-a,date,loanId:l.id,kind:'inicio',cat:'Préstamo',desc:l.dir==='in'?`Préstamo de ${person}`:`Préstamo a ${person}`,src:'prestamo'})}
    else if(r.type==='loanpay'){const l=S.loans.find(x=>x.id===r.loanId),inn=l.dir==='in';
      m=addMov({type:'loan',amount:inn?-a:a,date,loanId:l.id,kind:'pago',cat:'Préstamo',desc:inn?`Pago a ${l.person}`:`Cobro a ${l.person}`,src:'prestamo'})}
    else m=addMov({type:'expense',amount:a,date,cat:r.cat,desc:(r.desc||'').trim()||r.cat,src});
    if(i===0&&CAP.mode==='photo'&&CAP.img){try{localStorage.setItem(IMG+m.id,CAP.img);m.img=true}catch(e){imgFail=true}}
    ids.push(m.id);
  });
  save();closeSheet();render();
  const r0=rows[0],msg=rows.length>1?`Registrados ${rows.length} movimientos.`:
    r0.type==='income'?`Ingreso de ${money(r0.amount)} registrado.`:r0.type==='save'?`Apartaste ${money(r0.amount)} para tu meta. ¡Bien!`:
    r0.type==='bill'?`${rowTitle(r0).replace('Pago de ','')} quedó pagada.`:r0.type==='loan'?(r0.dir==='in'?`Deuda con ${cap1(r0.person.trim())} registrada.`:`Préstamo a ${cap1(r0.person.trim())} registrado.`):
    r0.type==='loanpay'?'Abono registrado.':`Gasto de ${money(r0.amount)} registrado.`;
  toast(imgFail?'Registrado, pero no hubo espacio para guardar la foto.':msg,{label:'Deshacer',fn:()=>{ids.forEach(delMov);S.loans=S.loans.filter(l=>!newLoans.includes(l.id));save();render()}});
}

  const m=addMov({type:'income',amount:a,date:$('#inF').value||todayStr(),cat:'Ingreso',desc:$('#inD').value.trim()||'Ingreso',src:'texto'});
  save();closeSheet();render();toast(`Ingreso de ${money(a)} registrado.`,undo([m.id]))}
function canBuy(v){
  const c=calc(),p=toNum(v);if(!p)return'';
  if(p<=c.left)return`<div class="note good">Sí. Cabe en lo de hoy y te quedarían ${money(c.left-p)}.</div>`;
  const after=c.flexNow-p;
  if(after>=0)return c.P.left>1?`<div class="note warn">Sí, sin tocar tu meta, pero tu plan diario desde mañana bajaría de ${money(c.tomorrow)} a ${money(after/(c.P.left-1))}.</div>`:`<div class="note warn">Sí, sin tocar tu meta.</div>`;
  return`<div class="note bad">No sin tocar tu meta: te faltarían ${money(-after)}. Podrías dejarla para el próximo período.</div>`;
}
function openCanBuy(){
  sheet(`<h3>¿Puedo comprarlo?</h3>${amtField('cbP','Precio')}<div id="cbR"></div>${btns(`<button class="btn line" onclick="closeSheet()">Cerrar</button>`)}`);
  $('#cbP').addEventListener('input',e=>{$('#cbR').innerHTML=canBuy(e.target.value)});setTimeout(()=>$('#cbP').focus(),60);
}

/* ----- Ajustar saldo (conciliación) ----- */
function openRecon(){
  sheet(`<h3>Ajustar saldo</h3><p class="muted" style="margin-top:0">Mira tu saldo en el banco e ingrésalo. Si no cuadra con lo registrado, te ayudamos a ordenar la diferencia.</p>
    ${amtField('rcR','Saldo real en tu cuenta',S.balance)}<div id="rcOut"></div>
    ${btns(cancel,`<button class="btn" style="flex:1" onclick="reconCompare()">Comparar</button>`)}`);
}
function reconCompare(){
  if(!$('#rcR').value.trim()){toast('Ingresa tu saldo real.');return}
  const diff=toNum($('#rcR').value)-S.balance;
  if(diff===0){S.checked=todayStr();save();closeSheet();render();toast('Tu saldo cuadra con lo registrado.');return}
  $('#rcOut').innerHTML=diff<0?`<div class="note warn">Hay ${money(-diff)} que no alcanzaste a anotar. Le pasa a todos. ¿Recuerdas en qué se fue?</div>
      <label class="f" for="rcC">Categoría</label><select id="rcC" class="i">${catOpts('Otros')}</select>
      <label class="f" for="rcD">Descripción (opcional)</label><input id="rcD" class="i">
      <div class="acts" style="margin-top:12px"><button class="btn" onclick="recon(${diff},true)">Guardar con esta categoría</button><button class="btn line" onclick="recon(${diff},false)">No sé, dejar sin identificar</button></div>`
    :`<div class="note good">Tienes ${money(diff)} más de lo registrado.</div>
      <div class="acts" style="margin-top:12px"><button class="btn" onclick="recon(${diff},true)">Actualizar mi saldo</button></div>`;
}
function recon(diff,ok){
  const cat=diff<0?(ok?$('#rcC').value:'Otros'):'Ingreso';
  const d=diff<0?(ok?(($('#rcD')||{}).value||'').trim()||cat:'Gasto sin identificar'):'Diferencia a favor';
  const m=addMov({type:'adjust',amount:diff,date:todayStr(),cat,desc:d,identified:diff<0?ok:true,src:'ajuste'});
  S.checked=todayStr();save();closeSheet();render();toast('Saldo actualizado.',undo([m.id]));
}

    ${m.loanId?`<div class="note warn">${m.kind==='pago'?'Si lo eliminas, el préstamo vuelve a quedar con ese saldo pendiente.':'Es el dinero con que se abrió el préstamo. Si lo eliminas, tu saldo se ajusta, pero el préstamo sigue registrado.'}</div>`:''}

function editMov(id){
  const m=S.movements.find(x=>x.id===id);const a=toNum($('#mvA').value);if(!a){toast('El monto no puede quedar en cero.');return}
  m.amount=a;m.desc=$('#mvD').value.trim()||m.desc;if($('#mvC'))m.cat=$('#mvC').value;m.date=$('#mvF').value||m.date;recalc();
  save();closeSheet();render();toast('Cambios guardados.');
}
function removeMov(id){if(!confirm('¿Eliminar este movimiento?'))return;delMov(id);save();closeSheet();render();toast('Movimiento eliminado.')}

function saveBill(id){
  const name=$('#bN').value.trim(),amount=toNum($('#bA').value),day=Math.min(31,Math.max(1,Number($('#bD').value)||1));
  let link=$('#bL').value.trim();if(link&&!/^https?:\/\//i.test(link))link='https://'+link;
  if(!name){toast('Ponle un nombre a la cuenta.');return}
  if(id)Object.assign(S.bills.find(x=>x.id===id),{name,amount,day,link});else S.bills.push({id:uid(),name,amount,day,link});
  save();closeSheet();render();toast(id?'Cuenta actualizada.':'Cuenta agregada.');
}
function delBill(id){if(!confirm('¿Eliminar esta cuenta? Los pagos ya registrados se mantienen en tus movimientos.'))return;
  S.bills=S.bills.filter(x=>x.id!==id);save();closeSheet();render()}
function openPay(id){
  const b=S.bills.find(x=>x.id===id);

function payBill(id){

function unpay(id){const m=billPaid(S.bills.find(x=>x.id===id),period());if(m){delMov(m.id);save();render();toast('La cuenta volvió a quedar pendiente.')}}
