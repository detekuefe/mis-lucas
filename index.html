<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Dinero</title>
<meta name="theme-color" content="#16845b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Dinero">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5F3;--surface:#FFFFFF;--ink:#13221B;--muted:#5C6C64;--line:#DCE5E0;
  --green:#16845B;--green-ink:#0E5E40;--mint:#DDF1E6;
  --amber:#9A6408;--amber-bg:#FBF0DA;--red:#B4392F;--red-bg:#FBE4E1;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1914;--surface:#15231C;--ink:#E4EEE8;--muted:#93A69C;--line:#26372E;
  --green:#1C8F63;--green-ink:#8FE0BA;--mint:#1B3A2C;
  --amber:#E2B04F;--amber-bg:#3A2E14;--red:#E0675E;--red-bg:#3D1F1C;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 14px}
.brand{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.02em}
.date{color:var(--muted);font-size:14px}
.hidden{display:none!important}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:1px}
.sync[hidden]{display:none}
.sync.ok{background:var(--green)}.sync.wait{background:#D9A02B}.sync.err{background:var(--red)}


/* El héroe: lo único llamativo de la app */
.hero{background:var(--green);color:#fff;border-radius:24px;padding:20px 20px 18px}
.hero.over{background:#B4392F}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.chip{font-size:13px;padding:4px 10px;border-radius:99px;background:rgb(255 255 255/.18);white-space:nowrap}
.amount{font-family:var(--display);font-weight:800;font-size:clamp(58px,18vw,100px);line-height:.92;letter-spacing:-.04em;margin:12px 0 16px;font-variant-numeric:tabular-nums}
.drain{height:10px;border-radius:99px;background:rgb(255 255 255/.22);overflow:hidden}
.drain i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .6s ease}
.hero-sub{font-size:14px;margin-top:10px;opacity:.92}
.hero-msg{margin:12px 0 0;font-size:15px;background:rgb(0 0 0/.13);padding:10px 12px;border-radius:12px}
.hero .btn{margin-top:10px;background:#fff;color:#0E5E40}

.capture{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 10px}
.cap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:650;cursor:pointer}
.cap span{font-size:26px;line-height:1.1}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.quick .btn{padding:9px 4px;font-size:13.5px}

.btn{display:inline-block;border:0;border-radius:12px;padding:11px 15px;font-weight:650;cursor:pointer;background:var(--green);color:#fff;text-decoration:none;text-align:center}
.btn.soft{background:var(--mint);color:var(--green-ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.block{display:block;width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btn.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.gbtn.block{display:flex}
.btn.gbtn svg{width:18px;height:18px;flex:none}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0;font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{font-family:var(--display);font-size:19px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kv{padding:5px 0}
.num{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.pos{color:var(--green)}
.note{border-radius:12px;padding:10px 12px;font-size:14.5px;margin-top:10px}
.note.good{background:var(--mint);color:var(--green-ink)}
.note.warn{background:var(--amber-bg);color:var(--amber)}
.note.bad{background:var(--red-bg);color:var(--red)}

.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.it:first-child{border-top:0}
.it .ic{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:18px;flex:none}
.it .tx{flex:1;min-width:0}
.it .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tx span{display:block}
.dayhead{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin:16px 2px 4px;font-weight:600}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav.tabs button{background:none;border:0;padding:6px 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--muted);cursor:pointer;min-width:68px}
nav.tabs button span{font-size:20px}
nav.tabs button.on{color:var(--green-ink);background:var(--mint);font-weight:650}

.sheet-bg{position:fixed;inset:0;background:rgb(8 22 15/.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.anim{animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0 0 12px}
label.f{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin:10px 0 4px}
.i{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:11px 12px;outline:none;min-width:0}
.i:focus{border-color:var(--green)}
textarea.i{resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:13px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:9px;border-radius:10px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.1)}
.ln{border:1px solid var(--line);border-radius:14px;padding:4px 12px 10px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ln .full{grid-column:1/-1}
.mic{width:100px;height:100px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:40px;display:block;margin:8px auto;cursor:pointer}
.mic.rec{background:#B4392F;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 16px rgb(180 57 47/.18)}}
.preview img{max-width:100%;max-height:280px;border-radius:12px;display:block;margin:10px auto}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-bottom:4px;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;white-space:nowrap;cursor:pointer;font-size:14px}
.chips button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--bg);border-radius:12px;padding:10px}
.stats b{display:block;font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;margin-top:2px}
.bill{border-top:1px solid var(--line);padding:12px 0}
.bill:first-of-type{border-top:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--muted);margin-top:3px}
.tag.late{background:var(--red-bg);color:var(--red)}
.tag.soon{background:var(--amber-bg);color:var(--amber)}
.tag.ok{background:var(--mint);color:var(--green-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:14px;display:none;gap:14px;align-items:center;z-index:60;width:max-content;max-width:calc(100% - 32px);font-size:14.5px;box-shadow:0 8px 24px rgb(0 0 0/.25)}
.toast.show{display:flex}
.toast button{background:none;border:0;color:#7FE0B2;font-weight:700;cursor:pointer;padding:0}
@media (prefers-color-scheme:dark){.toast button{color:var(--green)}}
.empty{text-align:center;padding:18px 8px;color:var(--muted)}

@media (min-width:900px){
  .app{max-width:1140px;padding:26px 34px 40px 258px}
  nav.tabs{top:0;bottom:0;right:auto;width:224px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:78px 14px 14px;gap:4px}
  nav.tabs button{flex-direction:row;font-size:15px;justify-content:flex-start;padding:10px 12px;gap:10px;min-width:0}
  nav.tabs button span{font-size:18px}
  .home{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:start}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  .sheet-bg{align-items:center}
  .sheet{border-radius:24px;max-height:86vh}
  .toast{bottom:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand">Mi Dinero</div><div class="date"><span id="syncDot" class="sync" hidden></span><span id="date"></span></div></header>
  <main>
    <section id="v-hoy" class="view"></section>
    <section id="v-mov" class="view hidden"></section>
    <section id="v-cue" class="view hidden"></section>
    <section id="v-aju" class="view hidden"></section>
  </main>
</div>
<nav class="tabs" aria-label="Secciones">
  <button data-t="hoy" onclick="go('hoy')"><span aria-hidden="true">☀️</span>Hoy</button>
  <button data-t="mov" onclick="go('mov')"><span aria-hidden="true">📒</span>Movimientos</button>
  <button data-t="cue" onclick="go('cue')"><span aria-hidden="true">🧾</span>Cuentas</button>
  <button data-t="aju" onclick="go('aju')"><span aria-hidden="true">⚙️</span>Ajustes</button>
</nav>
<div id="sheetBg" class="sheet-bg" onclick="if(event.target===this&&!LOCK)closeSheet()"><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status"><span id="toastMsg"></span><button id="toastBtn"></button></div>

<script>
/* ===================== Utilidades ===================== */
const KEY='mi_dinero_v2', IMG='mi_dinero_v2_img_', VERSION='2.2';
const CATS=[['Supermercado','🛒'],['Comida fuera','🍔'],['Transporte','🚌'],['Salud','💊'],['Hogar','🏠'],['Ocio','🎬'],['Compras','🛍️'],['Cuentas','🧾'],['Otros','📦']];
const catIcon=c=>(CATS.find(x=>x[0]===c)||[0,'📦'])[1];
const FMT=new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0});
const money=n=>FMT.format(Math.round(n||0)).replace('-$','−$');
const plain=n=>n?Math.round(n).toLocaleString('es-CL'):'';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const todayStr=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const dayDiff=(a,b)=>Math.round((parseYmd(a)-parseYmd(b))/864e5);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const nice=s=>{const d=parseYmd(s);return d.getDate()+' '+MES[d.getMonth()]};
const cap1=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const toNum=v=>{const n=Number(String(v??'').replace(/[^\d]/g,''));return isFinite(n)?n:0};
const sum=(a,f)=>a.reduce((x,m)=>x+f(m),0);

/* ===================== Datos ===================== */
// Efecto de cada movimiento sobre el saldo. El saldo siempre se calcula: saldo inicial + movimientos.
// Así dos dispositivos sincronizados nunca se pisan el saldo entre sí.
const eff=m=>m.type==='expense'?-m.amount:m.type==='income'?m.amount:m.type==='adjust'?m.amount:0;
function blank(){return{v:2,setup:false,created:todayStr(),opening:0,balance:0,checked:null,goal:{name:'Ahorro del mes',amount:0},payday:1,movements:[],bills:[],dayLog:{}}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===2){
  const r=Object.assign(blank(),s);
  if(s.opening===undefined)r.opening=(s.balance||0)-sum(r.movements,eff);
  if(r.paid){for(const k in r.paid)for(const b in r.paid[k]){const m=r.movements.find(x=>x.id===r.paid[k][b]);if(m)m.billPeriod=k}delete r.paid}
  return r}}catch(e){}return blank()}
let S=load();
function recalc(){S.balance=(S.opening||0)+sum(S.movements,eff)}
recalc();
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar: el almacenamiento está lleno. Exporta un respaldo y borra fotos de boletas antiguas.')}}
function save(){saveLocal();if(window.MD_SYNC)window.MD_SYNC.push()}
function addMov(m){m.id=m.id||uid();m.at=Date.now();S.movements.push(m);recalc();return m}
function delMov(id){
  const i=S.movements.findIndex(x=>x.id===id);if(i<0)return;
  const m=S.movements[i];S.movements.splice(i,1);recalc();
  if(m.img)try{localStorage.removeItem(IMG+id)}catch(e){}
}

/* ===================== Período y cálculo diario ===================== */
function period(){
  const t=todayStr(),now=parseYmd(t),pd=S.payday||1;
  const mk=(y,m)=>{const d=new Date(y,m,1);return new Date(d.getFullYear(),d.getMonth(),Math.min(pd,dim(d.getFullYear(),d.getMonth())))};
  let start=mk(now.getFullYear(),now.getMonth());
  if(start>now)start=mk(now.getFullYear(),now.getMonth()-1);
  const next=mk(start.getFullYear(),start.getMonth()+1);
  const end=new Date(next);end.setDate(end.getDate()-1);
  const s=ymd(start),e=ymd(end);
  return{start:s,end:e,key:s,left:dayDiff(e,t)+1,day:dayDiff(t,s)+1};
}
function billDue(b,P){
  const s=parseYmd(P.start);
  const at=(y,m)=>{const d=new Date(y,m,1);return new Date(d.getFullYear(),d.getMonth(),Math.min(b.day,dim(d.getFullYear(),d.getMonth())))};
  let d=at(s.getFullYear(),s.getMonth());
  if(ymd(d)<P.start)d=at(s.getFullYear(),s.getMonth()+1);
  return ymd(d);
}
function billPaid(b,P){return S.movements.find(m=>m.billId===b.id&&m.billPeriod===P.key)||null}

function calc(){
  recalc();
  const P=period(),t=todayStr();
  const inP=m=>m.date>=P.start&&m.date<=P.end;
  let pending=0,paidTodayEst=0,paidTotal=0,estTotal=0;
  S.bills.forEach(b=>{estTotal+=b.amount;const m=billPaid(b,P);if(!m)pending+=b.amount;else{paidTotal+=m.amount;if(m.date===t)paidTodayEst+=b.amount}});
  const todays=S.movements.filter(m=>m.date===t);
  const todayExp=sum(todays.filter(m=>m.type==='expense'),m=>m.amount);
  const todayDisc=sum(todays.filter(m=>m.type==='expense'&&!m.billId),m=>m.amount);
  const savesToday=sum(todays.filter(m=>m.type==='save'),m=>m.amount);
  const savesBefore=sum(S.movements.filter(m=>m.type==='save'&&inP(m)&&m.date<t),m=>m.amount);
  const goalStart=S.goal.amount+savesBefore, goalNow=goalStart+savesToday;
  // Plan del día: se calcula con el saldo al empezar el día, para que lo gastado hoy no se descuente dos veces
  const flexStart=(S.balance+todayExp)-(pending+paidTodayEst)-goalStart;
  const plan=Math.max(0,flexStart)/P.left;
  const used=todayDisc+savesToday, left=plan-used;
  const flexNow=S.balance-pending-goalNow;
  const tomorrow=P.left>1?Math.max(0,flexNow)/(P.left-1):0;
  return{P,t,pending,paidTotal,estTotal,todayDisc,savesToday,goalNow,saves:savesBefore+savesToday,plan,used,left,flexStart,flexNow,tomorrow};
}
const discOn=d=>sum(S.movements.filter(m=>m.date===d&&m.type==='expense'&&!m.billId),m=>m.amount);
const usedOn=d=>discOn(d)+sum(S.movements.filter(m=>m.date===d&&m.type==='save'),m=>m.amount);
function logDay(c){
  const L=S.dayLog[c.t],p=Math.round(c.plan);
  if(!L||Math.abs(L.plan-p)>1){
    S.dayLog[c.t]={plan:p};
    const lim=addDays(c.t,-150);for(const k in S.dayLog)if(k<lim)delete S.dayLog[k];
    save();
  }
}
function streak(){
  let n=0,d=addDays(todayStr(),-1);
  for(let i=0;i<120&&d>=S.created;i++){
    const L=S.dayLog[d],sp=discOn(d);
    if(!(L?sp<=L.plan+1:sp===0))break;
    n++;d=addDays(d,-1);
  }
  return n;
}
function yesterdayLeft(){const y=addDays(todayStr(),-1),L=S.dayLog[y];return L?L.plan-usedOn(y):0}
function periodMargin(c){let s=0;for(let d=c.P.start;d<c.t;d=addDays(d,1)){const L=S.dayLog[d];if(L)s+=L.plan-usedOn(d)}return s}

/* ===================== Interpretar texto y voz ===================== */
const NORM=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const KW={
 'Cuentas':['luz(\\s|$)','agua(\\s|$)','gas(\\s|$)','internet','telefono','plan celular','arriendo','dividendo','gastos comunes','cuota','seguro','enel','chilquinta','esval','cge(\\s|$)','vtr','entel','movistar','wom(\\s|$)','claro(\\s|$)','tarjeta'],
 'Supermercado':['super','lider','jumbo','unimarc','tottus','santa isabel','acuenta','feria','verdura','fruta','pan(\\s|$)','panaderia','almacen','minimarket','mercaderia','carniceria','leche','huevo','abarrote'],
 'Comida fuera':['almuerzo','comida','restaurant','restoran','cafe(\\s|$)','cafeteria','completo','sushi','pizza','hamburguesa','delivery','rappi','pedidos ya','pedidosya','uber eats','bar(\\s|$)','cerveza','helado','colacion','once(\\s|$)','empanada'],
 'Transporte':['bencina','combustible','copec','shell','aramco','petrobras','uber','didi','cabify','micro(\\s|$)','metro(\\s|$)','bip','peaje','tag(\\s|$)','estacionamiento','taxi','colectivo','bus(\\s|$)','pasaje','tren','merval','mecanico','neumatico'],
 'Salud':['farmacia','remedio','medicamento','cruz verde','salcobrand','ahumada','doctor','medico','consulta','dentista','examen','kine','clinica','bono(\\s|$)','isapre','fonasa','lentes'],
 'Hogar':['ferreteria','sodimac','easy(\\s|$)','aseo','limpieza','mueble','arreglo','gasfiter','lavanderia','jardin','construmart','detergente'],
 'Ocio':['cine','juego','salida','entrada','concierto','viaje','paseo','carrete','libro','netflix','spotify','disney','hbo','gimnasio','gym'],
 'Compras':['ropa','zapatilla','zapato','polera','pantalon','chaqueta','falabella','paris(\\s|$)','ripley','mercado libre','regalo','amazon','aliexpress','shein','temu','tienda']
};
const KWRE=Object.entries(KW).map(([c,l])=>[c,new RegExp('(^|\\s)('+l.join('|')+')')]);
function guessCat(t){const n=' '+NORM(t)+' ';for(const[c,re]of KWRE)if(re.test(n))return c;return 'Otros'}
const NUMW={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50,cien:100,media:0.5};
const AMT=/\$?\s*(\d{1,3}(?:\.\d{3})+|\d+(?:[.,]\d{1,2})?)\s*(lucas?|mil|k|palos?|mill[oó]n(?:es)?)?(?=[\s.,;!?]|$)/i;
const STOP=/(^|\s)(gast[eé]|gastamos|pagu[eé]|compr[eé]|me|sali[oó]|cost[oó]|costaron|fueron|son|hoy|ayer|anteayer|antes|en|el|la|los|las|de|del|por|un|una|unos|unas|para|al|con|que|pesos|clp|lucas?|mil|recib[ií]|pagaron|depositaron|transfirieron)(?=\s|$)/gi;
const INCOME=/(me pagaron|me depositaron|me transfirieron|me devolvieron|recib[ií]|ingreso|sueldo|gan[eé]|bono de)/i;

function parse(text){
  if(!text||!text.trim())return[];
  let t=' '+text.trim()+' ';
  let date=todayStr();
  if(/anteayer|antes de ayer/i.test(t))date=addDays(date,-2);else if(/\bayer\b/i.test(t))date=addDays(date,-1);
  t=t.replace(/(^|\s)(un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|quince|veinte|treinta|cuarenta|cincuenta|cien)\s+(lucas?|mil)(?=\s|$)/gi,(m,a,w,u)=>a+NUMW[w.toLowerCase()]+' '+u);
  t=t.replace(/(^|\s)lucas?(?=\s|$)/gi,(m,a,o,s)=>{const before=s.slice(0,o).trim();return /\d$/.test(before)?m:a+'1 luca'});
  t=t.replace(/(\d+(?:[.,]\d+)?)\s*(lucas?|mil)\s+y\s+media/gi,(m,n,u)=>(parseFloat(n.replace(',','.'))+0.5)+' '+u);
  const pieces=t.replace(/\s+(y|m[aá]s|adem[aá]s|tambi[eé]n|luego)\s+/gi,' | ').split(/,\s+|;|\|/).map(s=>s.trim()).filter(Boolean);
  const items=[];let carry='';
  for(const p of pieces){
    const m=p.match(AMT);
    if(!m){
      const d=p.replace(STOP,' ').replace(/\s+/g,' ').trim();
      if(!d)continue;
      if(items.length){const last=items[items.length-1];last.desc=last.desc?last.desc+', '+d:cap1(d);if(last.cat==='Otros')last.cat=guessCat(last.desc)}
      else carry=carry?carry+', '+d:d;
      continue;
    }
    let raw=m[1],n;
    if(/^\d{1,3}(\.\d{3})+$/.test(raw))n=Number(raw.replace(/\./g,''));else n=parseFloat(raw.replace(',','.'));
    const u=(m[2]||'').toLowerCase();
    if(/^(luca|lucas|mil|k)$/.test(u))n*=1000;else if(/^(palo|palos|mill)/.test(u))n*=1e6;else if(n<100)n*=1000;
    n=Math.round(n);if(!n)continue;
    let d=(p.slice(0,m.index)+' '+p.slice(m.index+m[0].length)).replace(STOP,' ').replace(/[$]/g,'').replace(/\s+/g,' ').trim();
    if(carry){d=carry+(d?', '+d:'');carry=''}
    const isInc=INCOME.test(p)||(INCOME.test(text)&&pieces.length===1);
    items.push({amount:n,desc:cap1(d),cat:isInc?'Ingreso':guessCat(d||p),date,type:isInc?'income':'expense'});
  }
  return items;
}

function dueClass(due,t){const d=dayDiff(due,t);return d<0?'late':d<=3?'soon':''}
function dueText(due,t){const d=dayDiff(due,t);return d<0?`venció hace ${-d} ${d===-1?'día':'días'}`:d===0?'vence hoy':d===1?'vence mañana':d<=3?`vence en ${d} días`:`vence el ${nice(due)}`}

function renderMov(c){
  const P=c.P,inP=m=>m.date>=P.start&&m.date<=P.end;
  const pm=S.movements.filter(inP);
  const outs=pm.filter(m=>m.type==='expense'||(m.type==='adjust'&&m.amount<0));
  const total=sum(outs,m=>Math.abs(m.amount));
  const bills=sum(outs.filter(m=>m.billId),m=>m.amount);
  const unk=sum(outs.filter(m=>m.identified===false),m=>Math.abs(m.amount));
  const byCat={};outs.forEach(m=>{const k=m.identified===false?'Sin identificar':m.cat;byCat[k]=(byCat[k]||0)+Math.abs(m.amount)});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const mx=cats.length?cats[0][1]:1;
  const disc=sum(outs.filter(m=>m.type==='expense'&&!m.billId),m=>m.amount);
  let insight='';
  const since=S.created>P.start?S.created:P.start, nd=dayDiff(c.t,since)+1;
  if(nd>=3&&disc>0){
    const avg=disc/nd;
    insight=`En promedio gastas ${money(avg)} al día fuera de cuentas; tu plan de hoy es ${money(c.plan)}.`;
    const wd={};S.movements.filter(m=>m.type==='expense'&&!m.billId&&m.date>=addDays(c.t,-60)).forEach(m=>{const d=parseYmd(m.date).getDay();(wd[d]=wd[d]||{}),wd[d][m.date]=(wd[d][m.date]||0)+m.amount});
    const avgs=Object.entries(wd).map(([d,o])=>[d,sum(Object.values(o),x=>x)/Object.keys(o).length,Object.keys(o).length]).filter(x=>x[2]>=2);
    if(avgs.length>=3){const top=avgs.sort((a,b)=>b[1]-a[1])[0];const rest=avgs.slice(1);const ra=sum(rest,x=>x[1])/rest.length;if(top[1]>ra*1.3)insight+=` Los ${DIA[top[0]]} sueles gastar ${Math.round((top[1]/ra-1)*100)}% más que el resto de la semana.`}
  }
  let list=RANGE==='per'?pm:S.movements;
  if(FILT==='Ingreso')list=list.filter(m=>m.type==='income'||(m.type==='adjust'&&m.amount>0));
  else if(FILT==='Sin identificar')list=list.filter(m=>m.identified===false);
  else if(FILT==='Meta')list=list.filter(m=>m.type==='save');
  else if(FILT!=='all')list=list.filter(m=>m.cat===FILT&&m.type!=='income'&&m.identified!==false);
  list=[...list].sort((a,b)=>a.date===b.date?(b.at||0)-(a.at||0):(a.date<b.date?1:-1));
  const groups={};list.forEach(m=>(groups[m.date]=groups[m.date]||[]).push(m));
  const present=new Set(S.movements.map(m=>m.cat));
  const chips=[['all','Todo'],...CATS.filter(x=>present.has(x[0])).map(x=>[x[0],x[0]]),['Ingreso','Ingresos'],['Meta','Apartado'],['Sin identificar','Sin identificar']];
  const dl=d=>d===c.t?'Hoy':d===addDays(c.t,-1)?'Ayer':cap1(DIA[parseYmd(d).getDay()])+' '+nice(d);
  $('#v-mov').innerHTML=`<div class="cols"><section class="card">
      <h2>Este período</h2><div class="small muted" style="margin:-6px 0 10px">Del ${nice(P.start)} al ${nice(P.end)}</div>
      <div class="stats"><div><span class="small muted">Gastado</span><b>${money(total)}</b></div><div><span class="small muted">En cuentas</span><b>${money(bills)}</b></div><div><span class="small muted">Sin identificar</span><b>${money(unk)}</b></div></div>
      ${cats.length?cats.map(([k,v])=>`<div class="row small"><span>${k==='Sin identificar'?'❔':catIcon(k)} ${esc(k)}</span><span class="num">${money(v)}</span></div><div class="bar"><i style="width:${v/mx*100}%"></i></div>`).join(''):`<div class="empty small">Aún no hay gastos en este período.</div>`}
      ${insight?`<div class="note good">${insight}</div>`:''}
    </section><section>
      <div class="chips" role="tablist">${[['per','Este período'],['all','Todo el historial']].map(([k,l])=>`<button class="${RANGE===k?'on':''}" onclick="RANGE='${k}';render()">${l}</button>`).join('')}</div>
      <div class="chips">${chips.map(([k,l])=>`<button class="${FILT===k?'on':''}" onclick="FILT='${esc(k)}';render()">${esc(l)}</button>`).join('')}</div>
      ${Object.keys(groups).length?Object.entries(groups).map(([d,ms])=>{const out=sum(ms.filter(m=>m.type==='expense'||(m.type==='adjust'&&m.amount<0)),m=>Math.abs(m.amount));return `<div class="dayhead"><span>${dl(d)}</span><span>${out?money(out):''}</span></div><div class="card" style="padding:4px 14px">${ms.map(itemHTML).join('')}</div>`}).join(''):`<div class="card empty small">No hay movimientos con este filtro.</div>`}
    </section></div>`;
}

let CAP=null,REC=null;
function openCapture(mode){CAP={mode,rows:[],img:null,full:null,text:''};drawCapture(true)}
function capMode(m){stopListen();CAP.mode=m;drawCapture(false)}
function drawCapture(anim){
  const m=CAP.mode;let body='';
  if(m==='text')body=`<label class="f" for="capText" style="margin-top:0">Escribe como hablas, o toca el micrófono de tu teclado para dictar. Puedes poner varios gastos a la vez.</label>
    <textarea id="capText" class="i" rows="3" placeholder="Ej: 18 lucas en el súper y 2.500 de café" oninput="CAP.text=this.value">${esc(CAP.text)}</textarea>
    <button class="btn soft block" style="margin-top:8px" onclick="interpret()">Interpretar</button>`;
  if(m==='voice')body=`<button id="mic" class="mic" onclick="listen()" aria-label="Dictar gasto">🎙️</button>
    <p id="micSt" class="small muted" style="text-align:center;margin:4px 0">Toca el micrófono y di, por ejemplo: «gasté 18 lucas en el súper y 2.500 en café».</p>
    ${CAP.text?`<p class="small" style="text-align:center;margin:4px 0">«${esc(CAP.text)}»</p>`:''}`;
  if(m==='photo')body=`<div class="acts" style="margin-top:0">
      <label class="btn soft" style="flex:1">📷 Tomar foto<input type="file" accept="image/*" capture="environment" hidden onchange="pickImg(this)"></label>
      <label class="btn line" style="flex:1">Elegir imagen<input type="file" accept="image/*" hidden onchange="pickImg(this)"></label></div>
    ${CAP.img?`<div class="preview"><img src="${CAP.img}" alt="Foto de la boleta"></div>
      <button class="btn line block" onclick="ocr()">Leer el total automáticamente</button><p id="ocrSt" class="small muted" style="margin:6px 0 0"></p>`:''}`;
  sheet(`<h3>Registrar gasto</h3>
    <div class="seg" role="tablist">${[['text','Escribir'],['voice','Dictar'],['photo','Boleta']].map(([k,l])=>`<button class="${m===k?'on':''}" onclick="capMode('${k}')">${l}</button>`).join('')}</div>
    ${body}<div id="lines">${linesHTML()}</div>
    <button class="linkbtn" style="margin-top:8px" onclick="addLine()">Agregar una línea a mano</button>
    ${btns(cancel,`<button id="commitBtn" class="btn" style="flex:1" onclick="commit()" ${CAP.rows.length?'':'disabled'}>${regLabel()}</button>`)}`,anim);
  if(m==='text'&&anim)setTimeout(()=>$('#capText')&&$('#capText').focus(),60);
}
const regLabel=()=>CAP.rows.length>1?`Registrar ${CAP.rows.length} movimientos`:'Registrar';
function linesHTML(){
  return CAP.rows.map((r,i)=>`<div class="ln">
    <div><label class="f">Monto</label><input class="i" inputmode="numeric" placeholder="$0" value="${plain(r.amount)}" oninput="this.value=plain(toNum(this.value));setRow(${i},'amount',toNum(this.value))"></div>
    <div><label class="f">Fecha</label><input class="i" type="date" value="${r.date}" onchange="setRow(${i},'date',this.value)"></div>
    <div class="full"><label class="f">Descripción</label><input class="i" value="${esc(r.desc)}" placeholder="Ej: Supermercado" oninput="setRow(${i},'desc',this.value)"></div>
    <div><label class="f">Tipo</label><select class="i" onchange="setRow(${i},'type',this.value);redrawLines()"><option value="expense">Gasto</option><option value="income" ${r.type==='income'?'selected':''}>Ingreso</option></select></div>
    <div>${r.type==='income'?'':`<label class="f">Categoría</label><select class="i" onchange="setRow(${i},'cat',this.value)">${catOpts(r.cat)}</select>`}</div>
    <div class="full"><button class="linkbtn" onclick="delLine(${i})">Quitar esta línea</button></div></div>`).join('');
}
function setRow(i,k,v){CAP.rows[i][k]=v}
function redrawLines(){$('#lines').innerHTML=linesHTML();const b=$('#commitBtn');b.disabled=!CAP.rows.length;b.textContent=regLabel()}
function addLine(){CAP.rows.push({amount:0,desc:'',cat:'Otros',date:todayStr(),type:'expense'});redrawLines()}
function delLine(i){CAP.rows.splice(i,1);redrawLines()}
function interpret(){
  const t=($('#capText')||{}).value||'';const items=parse(t);
  if(!items.length){toast('No encontré un monto. Escríbelo con números, por ejemplo «18 lucas» o «18.000».');return}
  CAP.rows.push(...items);CAP.text='';$('#capText').value='';redrawLines();
}
function voiceFallback(msg){
  const st=$('#micSt');if(!st)return;
  st.innerHTML=esc(msg)+`<br><button class="btn soft sm" style="margin-top:8px" onclick="capMode('text');setTimeout(()=>$('#capText').focus(),80)">Dictar con el micrófono del teclado</button>`;
}
function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){voiceFallback('Este navegador no permite dictar dentro de la app. Usa el micrófono de tu teclado: funciona igual.');return}
  if(REC){stopListen();return}
  const iOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
  let finalT='',errored=false,started=false;
  try{REC=new SR()}catch(e){voiceFallback('El dictado no está disponible en este teléfono.');return}
  REC.lang='es-CL';REC.interimResults=true;REC.maxAlternatives=1;
  $('#mic').classList.add('rec');$('#micSt').textContent='Activando el micrófono…';
  const guard=setTimeout(()=>{if(!started){errored=true;stopListen();REC=null;const m=$('#mic');if(m)m.classList.remove('rec');
    voiceFallback('El dictado no respondió en este teléfono. Puedes usar el micrófono del teclado.')}},4000);
  REC.onstart=()=>{started=true;clearTimeout(guard);const st=$('#micSt');if(st)st.textContent='Te escucho… habla ahora.'};
  REC.onresult=e=>{let tmp='';for(const r of e.results){if(r.isFinal)finalT=r[0].transcript;else tmp+=r[0].transcript}const st=$('#micSt');if(st)st.textContent=finalT||tmp||'Te escucho…'};
  REC.onerror=e=>{errored=true;clearTimeout(guard);
    const msgs={'not-allowed':'El teléfono no dio permiso al micrófono. Revisa los permisos del navegador para este sitio.',
      'service-not-allowed':iOS?'En iPhone el dictado a veces no funciona con la app instalada. Ábrela en Safari o usa el micrófono del teclado.':'El servicio de dictado está desactivado en este teléfono.',
      'audio-capture':'No se encontró un micrófono disponible. Puede que otra app lo esté usando.',
      'network':'El dictado necesita internet y los servicios de voz de Google.',
      'no-speech':'No escuché nada. Toca el micrófono y habla apenas se ponga rojo.',
      'language-not-supported':'Este teléfono no tiene dictado en español instalado.'};
    voiceFallback(msgs[e.error]||'No pude usar el dictado ('+e.error+').')};
  REC.onend=()=>{clearTimeout(guard);const m=$('#mic');if(m)m.classList.remove('rec');REC=null;
    if(finalT){CAP.text=finalT;const items=parse(finalT);
      if(items.length){CAP.rows.push(...items);drawCapture(false)}
      else{drawCapture(false);$('#micSt').textContent='Entendí «'+finalT+'», pero no un monto. Di el valor, por ejemplo «18 lucas».'}}
    else if(!errored)voiceFallback('No escuché nada. Toca el micrófono y habla apenas se ponga rojo.')};
  try{REC.start()}catch(e){clearTimeout(guard);REC=null;$('#mic').classList.remove('rec');voiceFallback('No se pudo activar el dictado. Puedes usar el micrófono del teclado.')}
}
function stopListen(){if(REC){try{REC.stop()}catch(e){}}}
function compress(file,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);res(cv.toDataURL('image/jpeg',q))};
  im.onerror=()=>rej(new Error('img'));im.src=u})}
async function pickImg(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  try{CAP.img=await compress(f,900,0.6);CAP.full=await compress(f,1800,0.85)}catch(e){toast('No pude abrir esa imagen. Prueba con otra foto.');return}
  if(!CAP.rows.length)CAP.rows.push({amount:0,desc:'',cat:'Otros',date:todayStr(),type:'expense'});
  drawCapture(false);
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function parseReceipt(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const nums=l=>[...l.matchAll(/(\d{1,3}(?:[.,]\d{3})+|\d{3,7})(?!\d)/g)].map(m=>Number(m[1].replace(/[.,]/g,''))).filter(n=>n>=100&&n<5e6);
  let cand=lines.filter(l=>/total/i.test(l)&&!/sub\s*-?total|neto|iva/i.test(l)).flatMap(nums);
  if(!cand.length)cand=lines.filter(l=>/total/i.test(l)).flatMap(nums);
  const shop=(lines.find(l=>/[a-záéíóúñ]{3,}/i.test(l)&&!/rut|boleta|factura|giro|fecha|direcc/i.test(l))||'').replace(/[^\wáéíóúñÁÉÍÓÚÑ .&-]/g,'').trim();
  return{total:cand.length?Math.max(...cand):0,shop};
}
async function ocr(){
  const st=$('#ocrSt');if(!CAP.full)return;
  st.textContent='Preparando el lector. La primera vez descarga unos MB, necesitas internet.';
  try{
    if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    const r=await Tesseract.recognize(CAP.full,'spa',{logger:m=>{if(m.status==='recognizing text'&&$('#ocrSt'))$('#ocrSt').textContent='Leyendo la boleta… '+Math.round(m.progress*100)+'%'}});
    const{total,shop}=parseReceipt(r.data.text||'');
    const row=CAP.rows[0]||(CAP.rows[0]={amount:0,desc:'',cat:'Otros',date:todayStr(),type:'expense'});
    if(total)row.amount=total;
    if(shop&&!row.desc){row.desc=cap1(shop.toLowerCase());row.cat=guessCat(shop)}
    redrawLines();
    $('#ocrSt').textContent=total?`Encontré un total de ${money(total)}. Revísalo: la lectura automática puede equivocarse.`:'No encontré el total en la foto. Escríbelo a mano.';
  }catch(e){if($('#ocrSt'))$('#ocrSt').textContent='No se pudo leer la boleta (¿sin internet?). Escribe el monto a mano.'}
}
function commit(){
  const rows=CAP.rows.filter(r=>r.amount>0);
  if(!rows.length){toast('Indica el monto de al menos una línea.');return}
  const src=CAP.mode==='voice'?'voz':CAP.mode==='photo'?'boleta':'texto';
  const ids=[];let imgFail=false,tot=0;
  rows.forEach((r,i)=>{
    const inc=r.type==='income';
    const m=addMov({type:inc?'income':'expense',amount:r.amount,date:r.date||todayStr(),cat:inc?'Ingreso':r.cat,desc:(r.desc||'').trim()||(inc?'Ingreso':r.cat),src});
    if(i===0&&CAP.mode==='photo'&&CAP.img){try{localStorage.setItem(IMG+m.id,CAP.img);m.img=true}catch(e){imgFail=true}}
    ids.push(m.id);if(!inc)tot+=r.amount;
  });
  save();closeSheet();render();
  toast(imgFail?'Registrado, pero no hubo espacio para guardar la foto.':rows.length>1?`Registrados ${rows.length} movimientos.`:(rows[0].type==='income'?`Ingreso de ${money(rows[0].amount)} registrado.`:`Gasto de ${money(tot)} registrado.`),undo(ids));
}

function saveGoal(){S.goal={name:$('#gn').value.trim()||'Ahorro del mes',amount:toNum($('#ga').value)};save();render();toast('Meta guardada.')}
function savePayday(){S.payday=Number($('#pd').value)||1;save();render();toast('Período actualizado.')}
function exportData(){
  const d={app:'mi_dinero',version:VERSION,fecha:new Date().toISOString(),datos:{}};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(KEY))d.datos[k]=localStorage.getItem(k)}
  const n='mi_dinero_respaldo_'+todayStr()+'.json',b=new Blob([JSON.stringify(d)],{type:'application/json'});
  try{const f=new File([b],n,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){navigator.share({files:[f],title:n}).catch(()=>{});return}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='mi_dinero'||!d.datos||!d.datos[KEY])throw 0;
    if(!confirm('Esto reemplazará los datos de este dispositivo por el respaldo del '+String(d.fecha||'').slice(0,10)+'. ¿Continuar?'))return;
    Object.keys(localStorage).filter(k=>k.startsWith(KEY)).forEach(k=>localStorage.removeItem(k));
    Object.entries(d.datos).forEach(([k,v])=>{if(k.startsWith(KEY))localStorage.setItem(k,v)});location.reload();
  }catch(e){toast('Ese archivo no es un respaldo de Mi Dinero 2.')}};
  r.readAsText(f);inp.value='';
}
async function resetAll(){
  const cloud=window.MD_SYNC&&MD_SYNC.user;
  if(!confirm(cloud?'¿Borrar todos los datos de Mi Dinero? Como tienes la sesión iniciada, se borrarán también de la nube y de tus otros dispositivos.':'¿Borrar todos los datos de Mi Dinero en este dispositivo?'))return;
  if(!confirm('Esta acción no se puede deshacer. ¿Seguro?'))return;
  if(cloud)await MD_SYNC.wipe();
  Object.keys(localStorage).filter(k=>k.startsWith(KEY)).forEach(k=>localStorage.removeItem(k));location.reload();
}

/* ===================== Sincronización (interfaz) ===================== */
const GLOGO='<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.2 1.5-5 2.3-8.2 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';
const SYNCTXT={off:['','Sin sesión'],connecting:['wait','Conectando…'],pending:['wait','Guardando en la nube…'],offline:['wait','Sin conexión. Se sincroniza cuando vuelva internet.'],ok:['ok','Sincronizado'],error:['err','No se pudo sincronizar']};
function syncCardHTML(){
  const s=window.MD_SYNC;
  if(!s)return`<h2>Sincronización</h2><p class="small muted" style="margin:0">No se pudo cargar la sincronización (puede ser falta de internet al abrir la app). Tus datos siguen guardados en este dispositivo.</p>`;
  if(!s.user)return`<h2>Sincronización</h2><p class="small muted" style="margin-top:0">Inicia sesión para ver los mismos datos en tu teléfono y en tu laptop. Si no inicias sesión, todo queda solo en este dispositivo.</p>
    <button class="btn gbtn" onclick="MD_SYNC.login()">${GLOGO}Iniciar sesión con Google</button>`;
  const [k,t]=SYNCTXT[s.state]||['',''];
  return`<h2>Sincronización</h2>
    <div class="row kv"><span class="muted">Cuenta</span><b style="overflow:hidden;text-overflow:ellipsis">${esc(s.user.email||'')}</b></div>
    <div class="row kv"><span class="muted">Estado</span><span><span class="sync ${k}"></span>${t}</span></div>
    ${s.error?`<div class="note bad">${esc(s.error)}</div>`:''}
    <p class="small muted">Lo que registres aquí aparece en tus otros dispositivos con la misma cuenta. Las fotos de boletas quedan solo en el equipo donde las tomaste.</p>
    <button class="btn line sm" onclick="MD_SYNC.logout()">Cerrar sesión</button>`;
}
function syncUI(){
  const s=window.MD_SYNC,d=$('#syncDot');
  if(d){const[k,t]=s&&s.user?(SYNCTXT[s.state]||['','']):['',''];d.className='sync '+k;d.title=t;d.setAttribute('aria-label',t);d.hidden=!(s&&s.user)}
  const b=$('#syncBox');if(b)b.innerHTML=syncCardHTML();
}
// La nube trajo cambios: actualizar pantalla sin pisar lo que el usuario está escribiendo
function syncApplied(){
  if(!S.setup){if(!LOCK)render();return}
  if(LOCK)closeSheet();
  if(!$('#sheetBg').classList.contains('open'))render();else{const c=calc();({hoy:renderHoy,mov:renderMov,cue:renderCue,aju:renderAju})[TAB](c)}
}

/* ===================== Inicio ===================== */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#sheetBg').classList.contains('open'))render()});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
<script type="module">
/* ===================== Sincronización con Firebase ===================== */
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,writeBatch} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig={
  apiKey:"AIzaSyDrcSzvnYhr8p9fiUcoRnmdzlGwdFrF_qw",
  authDomain:"mis-lucas-c6c6a.firebaseapp.com",
  projectId:"mis-lucas-c6c6a",
  storageBucket:"mis-lucas-c6c6a.firebasestorage.app",
  messagingSenderId:"803568074607",
  appId:"1:803568074607:web:2b2e7ae312836c8fedf29a"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app);
let db;
try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}
catch(e){db=initializeFirestore(app,{})}

const SK='md_sync_v2';            // lo último que este dispositivo sabe que está en la nube
const clean=o=>JSON.parse(JSON.stringify(o));
const sortK=o=>Array.isArray(o)?o.map(sortK):o&&typeof o==='object'?Object.keys(o).sort().reduce((r,k)=>(r[k]=sortK(o[k]),r),{}):o;
const J=o=>o==null?null:JSON.stringify(sortK(o));
const stateOf=()=>clean({setup:S.setup,created:S.created,opening:S.opening,checked:S.checked,goal:S.goal,payday:S.payday,dayLog:S.dayLog});

let prev=(()=>{try{return JSON.parse(localStorage.getItem(SK))||{}}catch(e){return{}}})();
const savePrev=()=>{try{localStorage.setItem(SK,JSON.stringify(prev))}catch(e){}};
let uid=null,unsubs=[],server=null,got={},meta={},busy=false,again=false,timer=null;

const MD=window.MD_SYNC={user:null,state:'off',error:'',login,logout,push,wipe};

function setState(){
  if(!uid)MD.state='off';
  else if(MD.error)MD.state='error';
  else if(!navigator.onLine)MD.state='offline';
  else if(!(got.m&&got.b&&got.s)||meta.s.fromCache)MD.state='connecting';
  else if(meta.m.hasPendingWrites||meta.b.hasPendingWrites||meta.s.hasPendingWrites)MD.state='pending';
  else MD.state='ok';
  syncUI();
}
addEventListener('online',setState);addEventListener('offline',setState);

function fail(e){
  MD.error=e&&e.code==='permission-denied'?'Firebase rechazó el acceso. Revisa las reglas de Firestore.':'Error de conexión con la nube ('+(e&&e.code||e)+').';
  setState();
}

function stop(){unsubs.forEach(u=>u());unsubs=[];uid=null;server=null;got={};meta={}}
function start(u){
  stop();uid=u.uid;server={m:{},b:{},s:null};MD.error='';
  if(prev.uid!==uid)prev={uid,m:{},b:{},s:null};
  const opts={includeMetadataChanges:true};
  unsubs.push(onSnapshot(collection(db,'users',uid,'movements'),opts,q=>{server.m={};q.forEach(d=>server.m[d.id]=d.data());meta.m=q.metadata;got.m=true;tick()},fail));
  unsubs.push(onSnapshot(collection(db,'users',uid,'bills'),opts,q=>{server.b={};q.forEach(d=>server.b[d.id]=d.data());meta.b=q.metadata;got.b=true;tick()},fail));
  unsubs.push(onSnapshot(doc(db,'users',uid,'meta','state'),opts,d=>{server.s=d.exists()?d.data():null;meta.s=d.metadata;got.s=true;tick()},fail));
  setState();
}
function tick(){
  if(got.m&&got.b&&got.s){
    const first=prev.s==null&&!Object.keys(prev.m).length&&!Object.keys(prev.b).length;
    // La primera vez en un dispositivo esperamos la respuesta real del servidor, no la caché
    if(!(first&&(meta.m.fromCache||meta.b.fromCache||meta.s.fromCache)))reconcile();
  }
  setState();
}
function push(){clearTimeout(timer);timer=setTimeout(()=>{if(uid&&got.m&&got.b&&got.s)reconcile()},250)}

// Une lo local con la nube. Regla: si algo cambió aquí desde la última sincronización, se sube;
// si no, manda lo que hay en la nube. Lo borrado en un lado se borra en el otro.
function reconcile(){
  if(busy){again=true;return}
  busy=true;
  try{
    const first=prev.s==null&&!Object.keys(prev.m).length&&!Object.keys(prev.b).length;
    if(first&&S.setup&&server.s&&server.s.setup&&(S.movements.length||S.bills.length)){
      if(confirm('Tu cuenta ya tiene datos de otro dispositivo.\n\nAceptar: usar los datos de tu cuenta y descartar los de este equipo.\nCancelar: combinar ambos.')){S.movements=[];S.bills=[]}
    }
    const writes=[];let changed=false;
    const merge=(arr,srv,pm,kind)=>{
      const L=Object.fromEntries(arr.map(x=>[x.id,x])),out=[],np={};
      for(const id of new Set([...Object.keys(L),...Object.keys(srv)])){
        const l=L[id],r=srv[id],p=pm[id],lj=l?J(clean(l)):null,rj=r?J(r):null;
        if(l&&r){
          if(lj===rj){out.push(l);np[id]=rj}
          else if(lj!==p){out.push(l);np[id]=lj;writes.push(['set',kind,id,clean(l)])}
          else{out.push(r);np[id]=rj;changed=true}
        }else if(l){
          if(p!==undefined)changed=true;                       // se borró en otro dispositivo
          else{out.push(l);np[id]=lj;writes.push(['set',kind,id,clean(l)])}
        }else{
          if(p!==undefined&&p===rj)writes.push(['del',kind,id]); // se borró aquí
          else{out.push(r);np[id]=rj;changed=true}
        }
      }
      return[out,np];
    };
    const[mo,mp]=merge(S.movements,server.m,prev.m,'movements');
    const[bo,bp]=merge(S.bills,server.b,prev.b,'bills');
    S.movements=mo;S.bills=bo;
    const ls=stateOf(),lsj=J(ls),rs=server.s,rsj=rs?J(rs):null;let ns;
    const take=()=>{Object.assign(S,{setup:!!rs.setup,created:rs.created||S.created,opening:rs.opening||0,checked:rs.checked||null,goal:rs.goal||{name:'Ahorro del mes',amount:0},payday:rs.payday||1,dayLog:rs.dayLog||{}});ns=rsj;changed=true};
    if(!rs){if(S.setup){writes.push(['state',ls]);ns=lsj}else ns=null}
    else if(lsj===rsj)ns=rsj;
    else if(!S.setup||prev.s==null)take();
    else if(lsj!==prev.s){writes.push(['state',ls]);ns=lsj}
    else take();
    prev={uid,m:mp,b:bp,s:ns};savePrev();
    for(const w of writes){if(w[0]==='set')server[w[1]==='movements'?'m':'b'][w[2]]=w[3];else if(w[0]==='del')delete server[w[1]==='movements'?'m':'b'][w[2]];else server.s=w[1]}
    recalc();saveLocal();
    if(writes.length)commit(writes);
    if(changed)syncApplied();
  }catch(e){console.error(e)}
  busy=false;
  if(again){again=false;push()}
}
function commit(writes){
  const ps=[];
  for(let i=0;i<writes.length;i+=400){
    const b=writeBatch(db);
    writes.slice(i,i+400).forEach(w=>{
      if(w[0]==='set')b.set(doc(db,'users',uid,w[1],w[2]),w[3]);
      else if(w[0]==='del')b.delete(doc(db,'users',uid,w[1],w[2]));
      else if(w[0]==='state')b.set(doc(db,'users',uid,'meta','state'),w[1]);
      else if(w[0]==='delstate')b.delete(doc(db,'users',uid,'meta','state'));
    });
    ps.push(b.commit().catch(fail));
  }
  return Promise.all(ps);
}
async function wipe(){
  if(!uid||!server)return;
  const w=[...Object.keys(server.m).map(id=>['del','movements',id]),...Object.keys(server.b).map(id=>['del','bills',id]),['delstate']];
  const p=commit(w);stop();
  await Promise.race([p,new Promise(r=>setTimeout(r,4000))]);
  prev={};savePrev();
}


async function login(){
  const prov=new GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
  try{await signInWithPopup(auth,prov)}
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')return signInWithRedirect(auth,prov);
    if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')return;
    toast(e.code==='auth/unauthorized-domain'?'Este sitio no está autorizado en Firebase. Agrégalo en Authentication → Configuración → Dominios autorizados.':e.code==='auth/network-request-failed'?'Sin conexión. Inicia sesión cuando tengas internet.':'No se pudo iniciar sesión ('+e.code+').');
  }
}
async function logout(){if(!confirm('¿Cerrar sesión? Tus datos se quedan en este dispositivo, pero dejarán de sincronizarse.'))return;await signOut(auth)}

getRedirectResult(auth).catch(()=>{});
onAuthStateChanged(auth,u=>{
  MD.user=u?{email:u.email,name:u.displayName}:null;
  if(u){start(u);if(!S.setup&&LOCK)onboarding();}else{stop();setState()}
  if(u&&!S.setup)toast('Sesión iniciada. Buscando tus datos…');
});
if(!S.setup&&LOCK)onboarding();
syncUI();
</script>
